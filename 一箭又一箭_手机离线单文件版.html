<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2b3244" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="mobile-web-app-capable" content="yes" />
    <title>一箭又一箭 · 纯净定制版</title>
    
    <style>
/* ==========================================================================
   《一箭又一箭》 纯净定制版 (Arrow by Arrow - Custom Edition)
   Combines Mahjong Titan's classic Top Toolbar, Boards List & 3-Star Modal
   with 《一箭又一箭》's Deep Slate Aesthetic, Day/Night Switch & Zoom Controls
   ========================================================================== */

:root {
  --bg-dark: #2b3244;
  --bg-darker: #1d222f;
  --bg-light: #eef2f9;
  --toolbar-bg: #22252a;
  --toolbar-border: #3a3f48;
  --card-bg: rgba(30, 34, 42, 0.96);
  --accent-red: #c92a2a;
  --gold-top: #ffe659;
  --gold-mid: #f7b500;
  --gold-bot: #d48800;
  --text-main: #f3f6fc;
  --text-muted: #9aa5b8;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #12151e;
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  touch-action: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

#app {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-dark);
}

/* On desktop/landscape screens, lock #app to 9:16 portrait mobile aspect ratio */
@media (min-aspect-ratio: 10/15) {
  #app {
    height: 100vh;
    width: calc(100vh * 9 / 16);
    max-width: 100vw;
    box-shadow: 0 0 48px rgba(0, 0, 0, 0.75);
    border-left: 1px solid rgba(255, 255, 255, 0.08);
    border-right: 1px solid rgba(255, 255, 255, 0.08);
  }
}

#app.theme-light {
  background: var(--bg-light);
  color: #242b3a;
}

/* ==========================================================================
   1. TOP NAVIGATION / ACTION TOOLBAR (Mahjong Titan Screenshot 3 & 5 Style)
   ========================================================================== */

.mt-topbar {
  padding-top: var(--safe-top);
  height: calc(56px + var(--safe-top));
  background: linear-gradient(180deg, #32363e 0%, #1c1e22 100%);
  border-bottom: 1px solid #454a54;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  z-index: 30;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
}

.mt-nav-btn {
  background: transparent;
  border: none;
  border-right: 1px solid rgba(255, 255, 255, 0.1);
  color: #f0f3f8;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  transition: background 0.15s, transform 0.1s;
}

.mt-nav-btn:last-child {
  border-right: none;
}

.mt-nav-btn:active {
  background: rgba(255, 255, 255, 0.12);
  transform: scale(0.96);
}

.mt-nav-btn.active-tab {
  color: #ff4d4d;
  background: rgba(255, 77, 77, 0.08);
}

.mt-nav-btn svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
}

/* ==========================================================================
   2. IN-GAME STATUS SUBHEADER (《一箭又一箭》 + Expected Time + Live Stars)
   ========================================================================== */

.game-subheader {
  height: 54px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(34, 40, 56, 0.88);
  border-bottom: 1px solid rgba(255, 255, 255, 0.09);
  backdrop-filter: blur(8px);
  z-index: 20;
  flex-shrink: 0;
}

#app.theme-light .game-subheader {
  background: rgba(235, 240, 249, 0.92);
  border-bottom: 1px solid rgba(0, 0, 0, 0.08);
  color: #242b3a;
}

.subheader-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-square-btn {
  width: 36px;
  height: 36px;
  border-radius: 9px;
  border: 1.5px solid rgba(110, 197, 184, 0.45);
  background: rgba(43, 50, 68, 0.85);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

#app.theme-light .icon-square-btn {
  background: #ffffff;
  color: #2b3244;
  border-color: rgba(94, 199, 184, 0.65);
}

/* Day / Night Pill Switch matching Screenshot 1 & 2 */
.theme-pill {
  width: 62px;
  height: 32px;
  border-radius: 16px;
  background: #4e6794;
  border: none;
  position: relative;
  cursor: pointer;
  padding: 3px;
  display: flex;
  align-items: center;
  transition: background 0.25s;
}

#app.theme-light .theme-pill {
  background: #87b5f5;
}

.theme-pill-knob {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #2f3b56;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  transform: translateX(30px);
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.25s;
}

#app.theme-light .theme-pill-knob {
  background: #ffffff;
  transform: translateX(0px);
}

.subheader-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1.15;
}

.level-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  font-weight: 700;
}

.live-stars-mini {
  display: inline-flex;
  gap: 3px;
}

.live-star-dot {
  font-size: 14px;
  color: #5c6475;
  transition: color 0.25s, transform 0.25s;
}

.live-star-dot.eligible {
  color: #ffd43b;
  text-shadow: 0 0 6px rgba(255, 212, 59, 0.45);
}

.timer-row {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: #d9e2f2;
  margin-top: 2px;
}

#app.theme-light .timer-row {
  color: #3b465e;
}

.timer-expected {
  font-size: 11px;
  color: #8fa0be;
  font-weight: 500;
}

.timer-overtime {
  color: #f2c94c;
}

.subheader-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.remain-badge {
  font-size: 12px;
  font-weight: 600;
  padding: 5px 9px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.09);
  color: #ced8ea;
  font-variant-numeric: tabular-nums;
}

#app.theme-light .remain-badge {
  background: rgba(43, 50, 68, 0.09);
  color: #2b3244;
}

/* ==========================================================================
   3. CANVAS PLAY AREA & BOTTOM ZOOM BAR (Screenshot 1 & 2 Style)
   ========================================================================== */

.canvas-stage {
  position: relative;
  flex: 1;
  width: 100%;
  overflow: hidden;
}

#boardCanvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: pointer;
}

/* Subtle non-intrusive toast notification */
.status-toast {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%) translateY(-10px);
  background: rgba(22, 26, 36, 0.9);
  color: #f8fafc;
  padding: 7px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid rgba(255, 255, 255, 0.14);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.22s, transform 0.22s;
  z-index: 25;
  white-space: nowrap;
}

.status-toast.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.bottom-bar {
  padding-bottom: var(--safe-bottom);
  height: calc(64px + var(--safe-bottom));
  padding-left: 14px;
  padding-right: 14px;
  background: rgba(34, 40, 56, 0.92);
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 20;
  flex-shrink: 0;
}

#app.theme-light .bottom-bar {
  background: rgba(235, 240, 249, 0.94);
  border-top: 1px solid rgba(0, 0, 0, 0.08);
}

.round-tool-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: none;
  border: none;
  color: #e2e8f0;
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  min-width: 52px;
}

#app.theme-light .round-tool-btn {
  color: #2b3244;
}

.round-tool-circle {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1.5px solid rgba(94, 199, 184, 0.55);
  background: rgba(43, 50, 68, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #5ec7b8;
  transition: transform 0.12s, background 0.2s, box-shadow 0.2s;
}

#app.theme-light .round-tool-circle {
  background: #ffffff;
}

.round-tool-btn.active .round-tool-circle {
  background: rgba(94, 199, 184, 0.22);
  box-shadow: 0 0 12px rgba(94, 199, 184, 0.45);
}

.round-tool-btn:active .round-tool-circle {
  transform: scale(0.92);
}

/* Zoom Pill Bar in center of bottom toolbar matching Screenshot 1 & 2 */
.zoom-pill-bar {
  flex: 1;
  max-width: 280px;
  height: 40px;
  background: rgba(58, 67, 88, 0.72);
  border-radius: 20px;
  padding: 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

#app.theme-light .zoom-pill-bar {
  background: rgba(195, 206, 226, 0.65);
}

.zoom-step-btn {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: none;
  background: #dce4f2;
  color: #2b3244;
  font-size: 16px;
  font-weight: 800;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}

.zoom-step-btn:active {
  transform: scale(0.9);
}

.zoom-slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 6px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.32);
  outline: none;
}

.zoom-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #ffffff;
  border: 3px solid #5ec7b8;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
}

/* ==========================================================================
   4. BOARDS LIST OVERLAY (Mahjong Titan Screenshot 3 Style)
   ========================================================================== */

.overlay-panel {
  position: absolute;
  inset: 0;
  background: #1e2024;
  z-index: 40;
  display: flex;
  flex-direction: column;
  transition: opacity 0.2s, transform 0.2s;
}

.overlay-panel.hidden {
  opacity: 0;
  pointer-events: none;
  transform: translateY(10px);
}

.boards-filter-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  height: 40px;
  background: #282b30;
  border-bottom: 1px solid #3c4048;
  flex-shrink: 0;
}

.filter-tab-btn {
  border: none;
  background: transparent;
  color: #cfd4de;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border-right: 1px solid #3c4048;
  transition: background 0.15s, color 0.15s;
}

.filter-tab-btn:last-child {
  border-right: none;
}

.filter-tab-btn.active {
  background: linear-gradient(180deg, #d63333 0%, #a61e1e 100%);
  color: #ffffff;
}

.boards-summary-strip {
  padding: 8px 16px;
  background: #23262b;
  border-bottom: 1px solid #343840;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  color: #aeb6c4;
}

.total-stars-pill {
  background: #16181c;
  border: 1px solid #494e58;
  padding: 3px 10px;
  border-radius: 6px;
  color: #ffffff;
  font-weight: 700;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.total-stars-pill span {
  color: #ffd43b;
}

.boards-list-scroll {
  flex: 1;
  overflow-y: auto;
  touch-action: pan-y;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(24px + var(--safe-bottom));
}

.board-row-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  min-height: 64px;
  background: #282b30;
  border-bottom: 2px solid #1b1d21;
  cursor: pointer;
  transition: background 0.12s;
}

.board-row-item:hover,
.board-row-item:active {
  background: #343840;
}

.board-row-item.current-level {
  border-left: 4px solid #f7b500;
}

.board-row-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.board-thumb-canvas {
  width: 50px;
  height: 50px;
  border-radius: 4px;
  background: #3d4047;
  flex-shrink: 0;
}

.board-row-info {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.board-row-number {
  font-size: 18px;
  font-weight: 600;
  color: #f1f5f9;
  display: flex;
  align-items: center;
  gap: 8px;
}

.board-row-subtitle {
  font-size: 12px;
  color: #94a3b8;
}

.board-row-stars {
  display: flex;
  align-items: center;
  gap: 6px;
}

.row-star-icon {
  width: 24px;
  height: 24px;
}

/* ==========================================================================
   5. VICTORY MODAL & 3-STAR SLAM ANIMATION (Mahjong Titan Screenshot 4 Style)
   ========================================================================== */

.victory-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(15, 18, 26, 0.78);
  backdrop-filter: blur(5px);
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  transition: opacity 0.25s;
}

.victory-backdrop.hidden {
  opacity: 0;
  pointer-events: none;
}

.victory-top-stats {
  position: absolute;
  top: calc(14px + var(--safe-top));
  left: 16px;
  right: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 20px;
  font-weight: 600;
  color: #ffffff;
}

.victory-card {
  width: 100%;
  max-width: 390px;
  background: rgba(36, 39, 46, 0.96);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 8px;
  padding: 28px 18px 22px;
  box-shadow: 0 18px 42px rgba(0, 0, 0, 0.65);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}

.victory-stars-grid {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  text-align: center;
}

.victory-star-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.star-slot-wrap {
  position: relative;
  width: 78px;
  height: 78px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.star-svg-base {
  width: 72px;
  height: 72px;
  filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.45));
}

/* Animated golden star that slams in from scale(2.4) like Screenshot 4! */
.star-svg-lit {
  position: absolute;
  width: 72px;
  height: 72px;
  opacity: 0;
  transform: scale(2.45) rotate(-12deg);
  filter: drop-shadow(0 0 16px rgba(255, 215, 0, 0.75));
  pointer-events: none;
}

.star-svg-lit.animate-in {
  animation: starSlamLight 0.55s cubic-bezier(0.22, 1.28, 0.36, 1) forwards;
}

@keyframes starSlamLight {
  0% {
    opacity: 0;
    transform: scale(2.5) rotate(-14deg);
  }
  45% {
    opacity: 0.85;
    transform: scale(1.35) rotate(4deg);
  }
  75% {
    opacity: 1;
    transform: scale(0.92) rotate(-2deg);
  }
  100% {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }
}

.star-cond-label {
  font-size: 13px;
  line-height: 1.35;
  color: #e2e8f0;
  font-weight: 500;
}

.star-cond-sub {
  font-size: 12px;
  color: #94a3b8;
}

/* Mahjong Titan Glossy Gold Pill Buttons (Screenshot 4) */
.victory-btn-row {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.mt-gold-btn {
  height: 44px;
  border-radius: 22px;
  border: 1px solid #ffd43b;
  background: linear-gradient(180deg, #ffe866 0%, #f5b400 55%, #df9400 100%);
  color: #1a1608;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.7);
  transition: transform 0.1s, filter 0.15s;
}

.mt-gold-btn:active {
  transform: scale(0.95);
  filter: brightness(0.93);
}

.victory-goal-banner {
  margin-top: 16px;
  width: 100%;
  max-width: 390px;
  background: rgba(34, 37, 44, 0.92);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 6px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: #f1f5f9;
}

/* Options / Goals inner container */
.settings-content {
  padding: 20px 16px;
  max-width: 480px;
  width: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow-y: auto;
}

.setting-card {
  background: #282b30;
  border: 1px solid #383c44;
  border-radius: 8px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.setting-card-title {
  font-size: 15px;
  font-weight: 600;
  color: #f1f5f9;
}

.setting-card-desc {
  font-size: 12px;
  color: #94a3b8;
  margin-top: 3px;
}

.toggle-btn {
  padding: 7px 16px;
  border-radius: 16px;
  border: none;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  background: #4b5563;
  color: #ffffff;
}

.toggle-btn.on {
  background: #5ec7b8;
  color: #112220;
}

</style>

           1. TOP ACTION BAR (Mahjong Titan Screenshot 5 Style)
           ================================================================ -->
      <header class="mt-topbar">
        <button id="btnHint" class="mt-nav-btn" title="提示下一条可移除的箭头">
          <svg viewBox="0 0 24 24">
            <path
              d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"

          </svg>

        </button>

          <svg viewBox="0 0 24 24">
            <path

    <script>
(function() {
// === [src/engine/patterns.js] ===
/**
 * 100 High-Density Levels for 《一箭又一箭》 (Arrow by Arrow)
 * Designed to match the exact grid density of the original WeChat mini-game (32x28 to 42x36 grids,
 * 90 to 200+ winding snake arrows per board, with 16:9 mobile portrait proportion).
 */
function sanitizeMask(mask) {
  const R = mask.length;
  const C = mask[0].length;
  const out = mask.map(row => [...row]);

  // Remove or connect any degree-0 or degree-1 isolated 1-cell islands
  let changed = true;
  let guard = 0;
  while (changed && guard++ < 8) {
    changed = false;
    for (let r = 0; r < R; r++) {
      for (let c = 0; c < C; c++) {
        if (out[r][c] === 1) {
          let neighbors = 0;
          if (r > 0 && out[r - 1][c] === 1) neighbors++;
          if (r < R - 1 && out[r + 1][c] === 1) neighbors++;
          if (c > 0 && out[r][c - 1] === 1) neighbors++;
          if (c < C - 1 && out[r][c + 1] === 1) neighbors++;
          if (neighbors === 0) {
            out[r][c] = 0;
            changed = true;
          }
        }
      }
    }
  }
  return out;
}

/**
 * Create a high-density grid mask with 1-cell dot padding around the shape
 * so empty grid dots are visible around and inside the silhouette like Screenshot 1 & 2.
 */
function buildHighDensityMask(rows, cols, shapeFn) {
  const mask = Array.from({ length: rows }, (_, r) =>
    Array.from({ length: cols }, (_, c) => {
      // Leave 1 cell margin on outer border so external dots frame the shape nicely
      if (r === 0 || r === rows - 1 || c === 0 || c === cols - 1) return 0;
      const ny = ((r - 1) / (rows - 3)) * 2 - 1; // -1 .. +1
      const nx = ((c - 1) / (cols - 3)) * 2 - 1; // -1 .. +1
      return shapeFn(nx, ny, r, c, rows, cols) ? 1 : 0;
    })
  );
  return sanitizeMask(mask);
}

/**
 * Distance from point (px, py) to segment (ax, ay)-(bx, by)
 */
function sdSegment(px, py, ax, ay, bx, by) {
  const pax = px - ax;
  const pay = py - ay;
  const bax = bx - ax;
  const bay = by - ay;
  const h = Math.max(0, Math.min(1, (pax * bax + pay * bay) / (bax * bax + bay * bay || 1)));
  return Math.hypot(pax - bax * h, pay - bay * h);
}

/**
 * Distance to box centered at (cx, cy) with half-extents (hx, hy)
 */
function sdBox(px, py, cx, cy, hx, hy) {
  const dx = Math.abs(px - cx) - hx;
  const dy = Math.abs(py - cy) - hy;
  return Math.hypot(Math.max(dx, 0), Math.max(dy, 0)) + Math.min(Math.max(dx, dy), 0);
}

/**
 * Distance to circle/ellipse
 */
function sdRing(px, py, cx, cy, radius, thickness) {
  return Math.abs(Math.hypot(px - cx, py - cy) - radius) - thickness;
}

/**
 * High-resolution bold glyph & emblem primitives (thick strokes like Screenshot Level 17 "B")
 */
const SHAPE_BUILDERS = [
  // 1. Bold Capital 'B' (The exact iconic shape from the user's Level 17 screenshot!)
  {
    name: '经典重装 · B字迷宫',
    fn: (nx, ny) => {
      const leftSpine = nx >= -0.88 && nx <= -0.22 && Math.abs(ny) <= 0.92;
      const topLoop =
        Math.hypot((nx + 0.08) * 0.92, (ny + 0.46) * 1.12) <= 0.62 &&
        Math.hypot((nx + 0.05) * 1.0, (ny + 0.46) * 1.15) >= 0.22;
      const botLoop =
        Math.hypot((nx + 0.05) * 0.88, (ny - 0.46) * 1.12) <= 0.66 &&
        Math.hypot((nx + 0.02) * 1.0, (ny - 0.46) * 1.15) >= 0.23;
      const topBar = ny >= -0.92 && ny <= -0.64 && nx >= -0.88 && nx <= 0.35;
      const midBar = Math.abs(ny) <= 0.16 && nx >= -0.88 && nx <= 0.42;
      const botBar = ny >= 0.64 && ny <= 0.92 && nx >= -0.88 && nx <= 0.45;
      return leftSpine || topLoop || botLoop || topBar || midBar || botBar;
    },
  },
  // 2. Bold 'S' Serpent
  {
    name: '灵蛇盘踞 · S形迷阵',
    fn: (nx, ny) => {
      const topArc =
        ny <= 0.1 &&
        sdRing(nx, (ny + 0.44) * 1.1, 0, 0, 0.48, 0.28) <= 0 &&
        !(nx > 0.15 && ny > -0.35);
      const botArc =
        ny >= -0.1 &&
        sdRing(nx, (ny - 0.44) * 1.1, 0, 0, 0.48, 0.28) <= 0 &&
        !(nx < -0.15 && ny < 0.35);
      const diag = sdSegment(nx, ny, -0.45, -0.25, 0.45, 0.25) <= 0.27;
      return topArc || botArc || diag;
    },
  },
  // 3. Giant Full Heart
  {
    name: '炽热之心 · 满格巨心',
    fn: (nx, ny) => {
      const x = nx * 1.12;
      const y = -ny * 1.1 + 0.18;
      const a = x * x + y * y - 0.62;
      const inside = a * a * a - x * x * y * y * y <= 0;
      const centerHole = Math.hypot(nx, ny + 0.05) < 0.2;
      return inside && !centerHole;
    },
  },
  // 4. Royal Double-Ring Target
  {
    name: '星环同心 · 双子魔环',
    fn: (nx, ny) => {
      const d = Math.hypot(nx, ny);
      const outer = d <= 0.96 && d >= 0.56;
      const inner = d <= 0.38;
      const cross = (Math.abs(nx) <= 0.18 || Math.abs(ny) <= 0.18) && d <= 0.96;
      return outer || inner || cross;
    },
  },
  // 5. Bold Figure '8' Hourglass
  {
    name: '无限回廊 · 八字天枢',
    fn: (nx, ny) => {
      const top =
        Math.hypot(nx * 0.92, (ny + 0.45) * 1.15) <= 0.66 &&
        Math.hypot(nx, (ny + 0.46) * 1.15) >= 0.22;
      const bot =
        Math.hypot(nx * 0.88, (ny - 0.45) * 1.15) <= 0.7 &&
        Math.hypot(nx, (ny - 0.46) * 1.15) >= 0.24;
      const waist = Math.abs(ny) <= 0.18 && Math.abs(nx) <= 0.52;
      return top || bot || waist;
    },
  },
  // 6. Imperial Butterfly
  {
    name: '凤尾蝶翼 · 幻彩对称',
    fn: (nx, ny) => {
      const ax = Math.abs(nx);
      const upperWing = Math.hypot((ax - 0.45) * 0.95, (ny + 0.35) * 1.05) <= 0.52;
      const lowerWing = Math.hypot((ax - 0.38) * 1.05, (ny - 0.42) * 1.05) <= 0.46;
      const body = ax <= 0.18 && Math.abs(ny) <= 0.85;
      const eyeHole = Math.hypot(ax - 0.52, ny + 0.38) < 0.16;
      return (upperWing || lowerWing || body) && !eyeHole;
    },
  },
  // 7. Four-Window Fortress
  {
    name: '九宫重城 · 四象方阵',
    fn: (nx, ny) => {
      const inSquare = Math.abs(nx) <= 0.94 && Math.abs(ny) <= 0.94;
      const hole =
        Math.abs(nx) >= 0.22 &&
        Math.abs(nx) <= 0.56 &&
        Math.abs(ny) >= 0.22 &&
        Math.abs(ny) <= 0.56;
      return inSquare && !hole;
    },
  },
  // 8. Bold Letter 'A'
  {
    name: '巅峰王座 · A字高塔',
    fn: (nx, ny) => {
      const leftLeg = sdSegment(nx, ny, 0, -0.82, -0.68, 0.82) <= 0.26;
      const rightLeg = sdSegment(nx, ny, 0, -0.82, 0.68, 0.82) <= 0.26;
      const crossbar = Math.abs(ny - 0.18) <= 0.2 && Math.abs(nx) <= 0.55;
      const topCap = Math.abs(ny + 0.72) <= 0.18 && Math.abs(nx) <= 0.35;
      return leftLeg || rightLeg || crossbar || topCap;
    },
  },
  // 9. Bold Letter 'G'
  {
    name: '玄武盘旋 · G字引力',
    fn: (nx, ny) => {
      const ring = sdRing(nx, ny, 0, 0, 0.62, 0.28) <= 0 && !(nx > 0.2 && ny < -0.05 && ny > -0.45);
      const shelf = ny >= -0.08 && ny <= 0.28 && nx >= -0.05 && nx <= 0.88;
      const pillar = nx >= 0.42 && nx <= 0.88 && ny >= -0.08 && ny <= 0.75;
      return ring || shelf || pillar;
    },
  },
  // 10. Giant Five-Pointed Star Emblem
  {
    name: '耀世星芒 · 五角星阵',
    fn: (nx, ny) => {
      const angle = Math.atan2(ny, nx) + Math.PI / 2;
      const r = Math.hypot(nx, ny);
      const starBound = 0.68 + 0.26 * Math.cos(angle * 5);
      const centerHole = r < 0.2;
      return r <= starBound && !centerHole;
    },
  },
  // 11. Bold Letter 'M'
  {
    name: '群峰耸立 · M字双峡',
    fn: (nx, ny) => {
      const ax = Math.abs(nx);
      const outerPillar = ax >= 0.46 && ax <= 0.92 && Math.abs(ny) <= 0.9;
      const vDiagonal = sdSegment(ax, ny, 0.7, -0.78, 0.0, 0.35) <= 0.25;
      const centerSpike = ax <= 0.24 && ny >= -0.25 && ny <= 0.65;
      return outerPillar || vDiagonal || centerSpike;
    },
  },
  // 12. Bold Letter 'R'
  {
    name: '骑士战旗 · R字纹章',
    fn: (nx, ny) => {
      const spine = nx >= -0.88 && nx <= -0.22 && Math.abs(ny) <= 0.92;
      const topBowl =
        Math.hypot((nx + 0.05) * 0.88, (ny + 0.42) * 1.1) <= 0.66 &&
        Math.hypot((nx + 0.02) * 1.0, (ny + 0.42) * 1.15) >= 0.22;
      const leg = sdSegment(nx, ny, -0.15, 0.02, 0.65, 0.82) <= 0.26;
      const topBar = ny >= -0.92 && ny <= -0.62 && nx >= -0.88 && nx <= 0.35;
      return spine || topBowl || leg || topBar;
    },
  },
  // 13. Ornate Chinese Lantern
  {
    name: '盛世华灯 · 宫灯迷阵',
    fn: (nx, ny) => {
      const body = Math.hypot(nx * 0.92, ny * 1.08) <= 0.86;
      const topCap = Math.abs(ny + 0.82) <= 0.14 && Math.abs(nx) <= 0.52;
      const botCap = Math.abs(ny - 0.82) <= 0.14 && Math.abs(nx) <= 0.52;
      const slitL = Math.abs(nx + 0.35) <= 0.11 && Math.abs(ny) <= 0.42;
      const slitR = Math.abs(nx - 0.35) <= 0.11 && Math.abs(ny) <= 0.42;
      return (body || topCap || botCap) && !slitL && !slitR;
    },
  },
  // 14. Four-Leaf Clover
  {
    name: '四叶奇迹 · 幸运草堂',
    fn: (nx, ny) => {
      const ax = Math.abs(nx);
      const ay = Math.abs(ny);

/**
 * Solver & Collision Detection Engine for 《一箭又一箭》
 */

/**
 * Build a fast lookup map from "r,c" (or r * cols + c) to arrow.id
 */
function buildOccupancyGrid(arrows, rows, cols) {
  const grid = new Int32Array(rows * cols).fill(-1);
  for (let i = 0; i < arrows.length; i++) {
    const arrow = arrows[i];
    if (arrow.removed) continue;
    for (const cell of arrow.cells) {
      if (cell.r >= 0 && cell.r < rows && cell.c >= 0 && cell.c < cols) {
        grid[cell.r * cols + cell.c] = arrow.id;
      }
    }
  }
  return grid;
}

/**
 * Check if a specific arrow can exit the board without hitting any other active arrow.
 * Returns { canExit: boolean, blockerId: number|null, blockerCell: {r,c}|null, distanceToBlocker: number }
 */
function checkArrowExit(arrow, activeArrows, rows, cols, prebuiltGrid = null) {
  const grid = prebuiltGrid || buildOccupancyGrid(activeArrows, rows, cols);
  const { r: hr, c: hc } = arrow.head;
  const { dr, dc } = arrow.dir;

  let step = 1;
  while (true) {
    const nr = hr + step * dr;
    const nc = hc + step * dc;
    if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) {
      return {
        canExit: true,
        blockerId: null,
        blockerCell: null,
        distanceToBlocker: step,
      };
    }
    const occupantId = grid[nr * cols + nc];
    if (occupantId !== -1) {
      return {
        canExit: false,
        blockerId: occupantId,
        blockerCell: { r: nr, c: nc },
        distanceToBlocker: step - 1,
      };
    }
    step++;
  }
}

/**
 * Return all currently removable (unblocked) arrows.
 */
function getRemovableArrows(activeArrows, rows, cols) {
  const remaining = activeArrows.filter(a => !a.removed);
  const grid = buildOccupancyGrid(remaining, rows, cols);
  return remaining.filter(arrow => checkArrowExit(arrow, remaining, rows, cols, grid).canExit);
}

/**
 * Pick one random removable arrow for the Hint feature.
 */
function getRandomHintArrow(activeArrows, rows, cols, rng = Math.random) {
  const removable = getRemovableArrows(activeArrows, rows, cols);
  if (removable.length === 0) return null;
  const idx = Math.floor(rng() * removable.length);
  return removable[idx];
}

/**
 * Verify that a set of arrows is 100% solvable from start to finish (zero deadlock).
 * Also returns a valid solution sequence of arrow IDs and complexity metrics.
 */
function verifySolvable(arrows, rows, cols) {
  const pool = arrows.filter(a => !a.removed).map(a => ({ ...a, removed: false }));
  const total = pool.length;
  const sequence = [];
  let layers = 0;

  while (sequence.length < total) {
    const grid = buildOccupancyGrid(pool, rows, cols);
    const removableNow = [];
    for (const arrow of pool) {
      if (arrow.removed) continue;
      if (checkArrowExit(arrow, pool, rows, cols, grid).canExit) {
        removableNow.push(arrow);
      }
    }
    if (removableNow.length === 0) {
      return {
        solvable: false,
        clearedCount: sequence.length,
        totalCount: total,
        sequence,
        layers,
      };
    }
    layers++;
    for (const arrow of removableNow) {
      arrow.removed = true;
      sequence.push(arrow.id);
    }
  }

  return {
    solvable: true,
    clearedCount: sequence.length,
    totalCount: total,
    sequence,
    layers,
  };
}

            let blocksEarlierRay = false;
            for (let j = 0; j <= i; j++) {
              const a = arrows[j];
              const adr = a.dir.dr;
              const adc = a.dir.dc;
              if (
                (adr !== 0 && nc === a.head.c && (nr - a.head.r) * adr > 0) ||
                (adc !== 0 && nr === a.head.r && (nc - a.head.c) * adc > 0)
              ) {
                blocksEarlierRay = true;
                break;
              }
            }
            if (!blocksEarlierRay) {
              existingArrow.cells.unshift({ r: nr, c: nc });
              remaining[nIdx] = 0;
              obstacles[nIdx] = 0;
              peeledGrid[nIdx] = 1;
              totalRemaining--;
              grew = true;
              absorbedIntoExisting = true;
              break;
            }
          }
        }
      }
      if (absorbedIntoExisting) {
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const idx = r * cols + c;
            if (remaining[idx] === 1 && countNeighbors(r, c, rows, cols, remaining) === 0) {
              orphanCells.push({ r, c, idx });
              remaining[idx] = 0;
              obstacles[idx] = 0;
              totalRemaining--;
            }
          }
        }
        if (totalRemaining <= 0) break;
        continue;
      }

      // Fallback if fixedObstacleGrid blocked a deep pocket: relax fixedObstacleGrid for this pocket
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const hIdx = r * cols + c;
          if (remaining[hIdx] !== 1) continue;
          for (const { dr, dc } of DIRS) {
            const pr = r - dr;
            const pc = c - dc;
            if (pr < 0 || pr >= rows || pc < 0 || pc >= cols) continue;
            const pIdx = pr * cols + pc;
            if (remaining[pIdx] !== 1) continue;
            const rayCheck = checkRayOnGrid(r, c, dr, dc, rows, cols, remaining, peeledGrid);
            if (rayCheck.clear) {
              candidates.push({
                hr: r,
                hc: c,
                hIdx,
                pr,
                pc,
                pIdx,
                dr,
                dc,
                passedPeeled: rayCheck.passedPeeled,
              });
            }
          }
        }
      }
      if (candidates.length === 0) break;
    }

    // Score candidates:
    // Prefer candidates that:
    // 1. Do not isolate neighbors when removing head + neck
    // 2. Pass through previously peeled cells (creates rich interlocking dependencies!)
    // 3. Have low degree (cleans up corners and peninsulas smoothly)
    const cleanCandidates = [];
    for (const cand of candidates) {
      remaining[cand.hIdx] = 0;
      remaining[cand.pIdx] = 0;
      const headIsolates = createsIsolatedNeighbor(cand.hr, cand.hc, rows, cols, remaining, -1);
      // For neck, if it creates a single isolated neighbor, we can step into that neighbor as the 3rd cell!
      let neckIsolatedCount = 0;
      let forcedNext = null;
      for (const { dr, dc } of DIRS) {
        const nr = cand.pr + dr;
        const nc = cand.pc + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
          const nIdx = nr * cols + nc;
          if (remaining[nIdx] === 1 && countNeighbors(nr, nc, rows, cols, remaining) === 0) {
            neckIsolatedCount++;
            forcedNext = { r: nr, c: nc, idx: nIdx };
          }
        }
      }
      remaining[cand.hIdx] = 1;
      remaining[cand.pIdx] = 1;

      if (!headIsolates && neckIsolatedCount <= 1) {
        const degH = countNeighbors(cand.hr, cand.hc, rows, cols, remaining);
        const weight =
          1 +
          (cand.passedPeeled > 0 ? 3.5 : 0) +
          (degH === 1 ? 2.5 : 0) +
          rng() * 2.0;
        cleanCandidates.push({ ...cand, forcedNext, weight });
      }
    }

    const pool = cleanCandidates.length > 0 ? cleanCandidates : candidates;
    // Weighted random selection from top candidates
    pool.sort((a, b) => (b.weight || 0) - (a.weight || 0));
    const topK = Math.min(pool.length, Math.max(4, Math.ceil(pool.length * 0.35)));
    const chosen = pool[Math.floor(rng() * topK)];

    // Start building snake from head -> neck -> tail
    const reversedCells = [
      { r: chosen.hr, c: chosen.hc, idx: chosen.hIdx },
      { r: chosen.pr, c: chosen.pc, idx: chosen.pIdx },
    ];
    remaining[chosen.hIdx] = 0;
    remaining[chosen.pIdx] = 0;
    obstacles[chosen.hIdx] = 0;
    obstacles[chosen.pIdx] = 0;
    peeledGrid[chosen.hIdx] = 1;
    peeledGrid[chosen.pIdx] = 1;
    totalRemaining -= 2;

    // Determine target length for this snake (allow longer tail if walking into shadowed pocket)
    let targetLen =
      minLen + Math.floor(rng() * (maxLen - minLen + 1));

    // Walk backwards from neck to grow the winding snake body
    let cur = { r: chosen.pr, c: chosen.pc, idx: chosen.pIdx };
    let prevDir = { dr: -chosen.dr, dc: -chosen.dc };
    let forcedStep = chosen.forcedNext || null;

    while (reversedCells.length < targetLen && totalRemaining > 0) {
      if (forcedStep && remaining[forcedStep.idx] === 1) {
        const stepCell = forcedStep;
        forcedStep = null;
        reversedCells.push(stepCell);
        remaining[stepCell.idx] = 0;
        obstacles[stepCell.idx] = 0;
        peeledGrid[stepCell.idx] = 1;
        totalRemaining--;
        prevDir = { dr: stepCell.r - cur.r, dc: stepCell.c - cur.c };
        cur = stepCell;
        continue;
      }

      // Gather valid next tail steps from `cur`
      const stepOptions = [];
      for (const { dr, dc } of DIRS) {
        const nr = cur.r + dr;
        const nc = cur.c + dc;
        if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
        const nIdx = nr * cols + nc;
        if (remaining[nIdx] !== 1) continue;

        // Tentatively remove nIdx and check how many isolated neighbors it creates
        remaining[nIdx] = 0;
        let isolatedNeighbors = [];
        for (const d2 of DIRS) {
          const nnr = nr + d2.dr;
          const nnc = nc + d2.dc;
          if (nnr >= 0 && nnr < rows && nnc >= 0 && nnc < cols) {
            const nnIdx = nnr * cols + nnc;
            if (remaining[nnIdx] === 1 && countNeighbors(nnr, nnc, rows, cols, remaining) === 0) {
              isolatedNeighbors.push({ r: nnr, c: nnc, idx: nnIdx });
            }
          }
        }
        remaining[nIdx] = 1;

        // If stepping into (nr, nc) leaves 0 isolated neighbors, or leaves 1 isolated neighbor and we still have length budget to absorb it
        if (
          isolatedNeighbors.length === 0 ||
          (isolatedNeighbors.length === 1 && reversedCells.length + 1 < maxLen + 2)
        ) {
          const isTurn = dr !== prevDir.dr || dc !== prevDir.dc;
          const deg = countNeighbors(nr, nc, rows, cols, remaining);
          const isShadowed = shadowedByFixed[nIdx] === 1;
          // Favor 90-degree turns and strongly pull tail into pockets shadowed by fixedObstacleGrid
          const score =
            (isShadowed ? 12.0 : 0) +
            (isTurn ? 2.6 : 1.0) +
            (deg <= 2 ? 2.0 : 0) +
            (isolatedNeighbors.length === 0 ? 2.0 : 0) +
            rng() * 1.5;
          stepOptions.push({
            r: nr,
            c: nc,
            idx: nIdx,
            dr,
            dc,
            forcedAfter: isolatedNeighbors[0] || null,
            score,
          });
        }
      }

      if (stepOptions.length === 0) break;
      stepOptions.sort((a, b) => b.score - a.score);
      const pick = stepOptions[0];

      const nextCell = { r: pick.r, c: pick.c, idx: pick.idx };
      if (shadowedByFixed[nextCell.idx] === 1 && targetLen < maxLen + 8) {
        targetLen++;
      }
      reversedCells.push(nextCell);
      remaining[nextCell.idx] = 0;
      obstacles[nextCell.idx] = 0;
      peeledGrid[nextCell.idx] = 1;
      totalRemaining--;
      prevDir = { dr: pick.dr, dc: pick.dc };
      cur = nextCell;
      forcedStep = pick.forcedAfter;
    }

    // If any single isolated neighbor was left adjacent to tail or body, absorb it if adjacent to tail
    let absorbed = true;
    while (absorbed && totalRemaining > 0) {
      absorbed = false;
      for (const { dr, dc } of DIRS) {
        const nr = cur.r + dr;
        const nc = cur.c + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
          const nIdx = nr * cols + nc;
          if (remaining[nIdx] === 1 && countNeighbors(nr, nc, rows, cols, remaining) === 0) {
            const tailCell = { r: nr, c: nc, idx: nIdx };
            reversedCells.push(tailCell);
            remaining[nIdx] = 0;
            obstacles[nIdx] = 0;
            peeledGrid[nIdx] = 1;
            totalRemaining--;
            cur = tailCell;
            absorbed = true;
            break;
          }
        }
      }
    }

    // Sweep for any accidental degree-0 single cell in `remaining` and attach it to an adjacent existing snake tail
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const idx = r * cols + c;
        if (remaining[idx] === 1 && countNeighbors(r, c, rows, cols, remaining) === 0) {
          orphanCells.push({ r, c, idx });
          remaining[idx] = 0;
          obstacles[idx] = 0;
          totalRemaining--;
        }
      }
    }

    // `reversedCells` is ordered [head, neck, ..., tail]. Reverse it so `cells` is [tail, ..., neck, head]
    const cells = reversedCells.reverse().map(({ r, c }) => ({ r, c }));
    const color = ARROW_PALETTE[(nextId - 1 + Math.floor(rng() * 3)) % ARROW_PALETTE.length];

    arrows.push({
      id: nextId++,
      cells,
      head: { r: chosen.hr, c: chosen.hc },
      dir: { dr: chosen.dr, dc: chosen.dc },
      color,
      removed: false,
    });
  }

  // Try to attach any orphan single cells to the tail of an orthogonally adjacent arrow
  for (const orphan of orphanCells) {
    for (const arrow of arrows) {
      const tail = arrow.cells[0];
      if (Math.abs(tail.r - orphan.r) + Math.abs(tail.c - orphan.c) === 1) {
        // Check that adding orphan to tail does not block arrow's own head ray
        const dr = arrow.dir.dr;
        const dc = arrow.dir.dc;
        const onOwnRay =
          (dr !== 0 && orphan.c === arrow.head.c && (orphan.r - arrow.head.r) * dr > 0) ||
          (dc !== 0 && orphan.r === arrow.head.r && (orphan.c - arrow.head.c) * dc > 0);
        if (!onOwnRay) {
          arrow.cells.unshift({ r: orphan.r, c: orphan.c });
          break;
        }
      }
    }
  }

  // Assign well-distributed colors so adjacent arrows contrast nicely
  for (let i = 0; i < arrows.length; i++) {
    arrows[i].color = ARROW_PALETTE[(i * 3 + (seed % 7)) % ARROW_PALETTE.length];
  }

  return arrows;
}

/**
 * 1. Generate a full level from its level definition
 */
function generateFullLevel(levelDef, seedOverride = null) {
  const mask = levelDef.mask;
  const rows = mask.length;
  const cols = mask[0].length;
  const targetGrid = new Uint8Array(rows * cols);

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      targetGrid[r * cols + c] = mask[r][c] ? 1 : 0;
    }
  }

  const baseSeed = seedOverride !== null ? seedOverride : levelDef.seed;
  for (let attempt = 0; attempt < 10; attempt++) {
    const arrows = partitionCellsIntoArrows({
      rows,
      cols,
      targetGrid,
      minLen: levelDef.minSnakeLen || 3,
      maxLen: levelDef.maxSnakeLen || 12,
      seed: baseSeed + attempt * 97,
      startId: 1,
    });
    const check = verifySolvable(arrows, rows, cols);
    if (check.solvable) {
      return {
        rows,
        cols,
        mask,
        arrows,
        expectedSeconds: levelDef.expectedSeconds,
      };
    }
  }

  throw new Error(`Failed to generate solvable level for level ${levelDef.id}`);
}

/**
 * 2. Shuffle only the currently remaining (unremoved) arrows on the board.
 */
function shuffleRemainingArrows(currentArrows, rows, cols, seed, levelDef = {}) {
  const remainingArrows = currentArrows.filter(a => !a.removed);
  if (remainingArrows.length === 0) return [];

  const targetGrid = new Uint8Array(rows * cols);
  let cellCount = 0;
  for (const arrow of remainingArrows) {
    for (const cell of arrow.cells) {
      targetGrid[cell.r * cols + cell.c] = 1;
      cellCount++;
    }
  }

  const avgLen = cellCount / remainingArrows.length;
  const minLen = Math.max(2, Math.floor(avgLen - 1.5));
  const maxLen = Math.max(minLen + 1, Math.ceil(avgLen + 1.5));

  for (let attempt = 0; attempt < 12; attempt++) {
    const newArrows = partitionCellsIntoArrows({
      rows,
      cols,
      targetGrid,
      minLen,
      maxLen,
      seed: seed + attempt * 131,
      startId: 1,
    });
    if (verifySolvable(newArrows, rows, cols).solvable) {
      return newArrows;
    }
  }
  return remainingArrows;
}

/**
 * 3. Rule 4 Special Feature:
 * When the player clicks Shuffle (producing `shuffledArrows` on the remaining cells)
 * and then immediately clicks Restart, keep `shuffledArrows` intact as the core layout
 * and generate the missing cleared arrows around them on `fullMask` so the entire board
 * is complete and 100% solvable!
 */
function extendShuffledToFull(shuffledArrows, fullMask, rows, cols, seed, levelDef = {}) {
  const activeShuffled = shuffledArrows.filter(a => !a.removed).map(a => ({
    ...a,
    cells: a.cells.map(c => ({ ...c })),
    head: { ...a.head },
    dir: { ...a.dir },
    removed: false,
  }));

  const remGrid = new Uint8Array(rows * cols);
  let maxExistingId = 0;
  for (const arrow of activeShuffled) {
    if (arrow.id > maxExistingId) maxExistingId = arrow.id;
    for (const cell of arrow.cells) {
      remGrid[cell.r * cols + cell.c] = 1;
    }
  }

  // Missing cells = cells in fullMask (or original full board) that are not in remGrid
  const missingGrid = new Uint8Array(rows * cols);
  let missingCount = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const idx = r * cols + c;
      if (fullMask[r][c] === 1 && remGrid[idx] === 0) {
        missingGrid[idx] = 1;
        missingCount++;
      }
    }
  }

  if (missingCount === 0) {
    return activeShuffled;
  }

  for (let attempt = 0; attempt < 15; attempt++) {
    const outerArrows = partitionCellsIntoArrows({
      rows,
      cols,
      targetGrid: missingGrid,
      fixedObstacleGrid: remGrid,
      minLen: levelDef.minSnakeLen || 3,
      maxLen: levelDef.maxSnakeLen || 12,
      seed: seed + attempt * 193,
      startId: maxExistingId + 1,
    });

    const combined = [...outerArrows, ...activeShuffled];
    if (verifySolvable(combined, rows, cols).solvable) {
      return combined;
    }
  }

  // Ultimate fallback: if an inner pocket had a mutual ray dependency, regenerate full board with seed
  return generateFullLevel(
    {
      id: levelDef.id || 0,
      mask: fullMask,
      minSnakeLen: levelDef.minSnakeLen || 3,
      maxSnakeLen: levelDef.maxSnakeLen || 12,
      expectedSeconds: levelDef.expectedSeconds || 180,
      seed,
    },
    seed
  ).arrows;
}

/**
 * Web Audio Synthesizer & Mobile Haptics Controller
 * Zero external audio assets needed — crisp, responsive procedural sound effects + vibration.
 */

class FeedbackController {
  constructor() {
    this.ctx = null;
    this.soundEnabled = true;
    this.vibrateEnabled = true;
    this.comboCount = 0;
    this.lastClearTime = 0;
  }

  initContext() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        this.ctx = new AudioCtx();
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
  }

  /**
   * Trigger phone vibration (Rule 2: vibrate on blocked arrow tap)
   */
  vibrate(pattern = [45, 30, 55]) {
    if (!this.vibrateEnabled) return;
    try {
      if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') {
        navigator.vibrate(pattern);
      }
    } catch (_) {
      // Ignore if unsupported by browser
    }
  }

  /**
   * Crisp, satisfying arrow launch / slither-out sound
   */
  playArrowClear() {
    if (!this.soundEnabled) return;
    this.initContext();
    if (!this.ctx) return;

    const now = performance.now();
    if (now - this.lastClearTime < 2200) {
      this.comboCount = Math.min(this.comboCount + 1, 10);
    } else {
      this.comboCount = 0;
    }
    this.lastClearTime = now;

    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    // Pentatonic scale progression for combo satisfaction
    const baseFreqs = [392.0, 440.0, 493.88, 587.33, 659.25, 783.99, 880.0, 987.77, 1174.66];
    const startFreq = baseFreqs[this.comboCount % baseFreqs.length];

    osc.type = 'sine';
    osc.frequency.setValueAtTime(startFreq, t);
    osc.frequency.exponentialRampToValueAtTime(startFreq * 1.45, t + 0.14);

    gain.gain.setValueAtTime(0.001, t);
    gain.gain.linearRampToValueAtTime(0.18, t + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.17);
  }

  /**
   * Rule 2: Blocked arrow tactile vibration + soft wooden thud (never punishing, just clear feedback)
   */
  triggerBlockedFeedback() {
    this.vibrate([45, 30, 55]);
    if (!this.soundEnabled) return;
    this.initContext();
    if (!this.ctx) return;

    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(145, t);
    osc.frequency.exponentialRampToValueAtTime(72, t + 0.09);

    gain.gain.setValueAtTime(0.001, t);
    gain.gain.linearRampToValueAtTime(0.22, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.11);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.12);
  }

  /**
   * Hint button sparkle sound
   */
  playHint() {
    if (!this.soundEnabled) return;
    this.initContext();
    if (!this.ctx) return;

    const t = this.ctx.currentTime;
    [587.33, 880.0].forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t + i * 0.06);
      gain.gain.setValueAtTime(0.001, t + i * 0.06);
      gain.gain.linearRampToValueAtTime(0.14, t + i * 0.06 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.06 + 0.22);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t + i * 0.06);
      osc.stop(t + i * 0.06 + 0.23);
    });
  }

  /**
   * Shuffle button ripple sound
   */
  playShuffle() {
    if (!this.soundEnabled) return;
    this.initContext();
    if (!this.ctx) return;

    const t = this.ctx.currentTime;
    const notes = [330, 392, 493.88, 587.33];
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t + idx * 0.04);
      gain.gain.setValueAtTime(0.001, t + idx * 0.04);
      gain.gain.linearRampToValueAtTime(0.12, t + idx * 0.04 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.04 + 0.14);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t + idx * 0.04);
      osc.stop(t + idx * 0.04 + 0.15);
    });
  }

  /**
   * Star lighting pop sound (for Victory Modal star animation 1, 2, 3)
   */
  playStarPop(starIndex = 0) {
    this.vibrate(25);
    if (!this.soundEnabled) return;
    this.initContext();
    if (!this.ctx) return;

    const t = this.ctx.currentTime;
    const freqs = [523.25, 659.25, 783.99, 1046.5];
    const freq = freqs[Math.min(starIndex, freqs.length - 1)];

    const osc = this.ctx.createOscillator();
    const osc2 = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'sine';
    osc2.type = 'triangle';
    osc.frequency.setValueAtTime(freq, t);
    osc2.frequency.setValueAtTime(freq * 1.5, t);

    gain.gain.setValueAtTime(0.001, t);
    gain.gain.linearRampToValueAtTime(0.2, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.38);

    osc.connect(gain);
    osc2.connect(gain);
    gain.connect(this.ctx.destination);

    osc.start(t);
    osc2.start(t);
    osc.stop(t + 0.4);
    osc2.stop(t + 0.4);
  }
}
const feedback = new FeedbackController();

    this.arrows = arrows;
    this.hintArrowId = null;
    this.slitheringArrows.clear();
    this.shakingArrows.clear();
    this.resetCamera();
    this.triggerShuffleWave();
  }

  updateArrows(arrows, animateWave = false) {
    this.arrows = arrows;
    this.hintArrowId = null;
    this.slitheringArrows.clear();
    this.shakingArrows.clear();
    if (animateWave) {
      this.triggerShuffleWave();
    }
  }

  triggerShuffleWave() {
    this.shuffleTransition = {
      startTime: performance.now(),
      duration: 360,
    };
  }

  setTheme(theme) {
    this.theme = theme;
  }

  setGuideLines(enabled) {
    this.showGuideLines = enabled;
  }

  setHintArrow(arrowId) {
    this.hintArrowId = arrowId;
  }

  resetCamera() {
    this.zoom = 1.0;
    this.panX = 0;
    this.panY = 0;
    this.computeLayout();
    if (this.onZoomChange) this.onZoomChange(this.zoom);
  }

  setZoom(newZoom, anchorScreenX = null, anchorScreenY = null) {
    const clamped = Math.max(this.minZoom, Math.min(this.maxZoom, newZoom));
    const rect = this.canvas.getBoundingClientRect();
    const cx = anchorScreenX !== null ? anchorScreenX : rect.width / 2;
    const cy = anchorScreenY !== null ? anchorScreenY : rect.height / 2;

    // Keep the point under (cx, cy) stationary during zoom
    const worldX = (cx - rect.width / 2 - this.panX) / this.zoom;
    const worldY = (cy - rect.height / 2 - this.panY) / this.zoom;

    this.zoom = clamped;
    this.panX = cx - rect.width / 2 - worldX * this.zoom;
    this.panY = cy - rect.height / 2 - worldY * this.zoom;
    this.clampPan();

    if (this.onZoomChange) this.onZoomChange(this.zoom);
  }

  clampPan() {
    const rect = this.canvas.getBoundingClientRect();
    const maxOffset = Math.max(rect.width, rect.height) * 0.55 * this.zoom;
    this.panX = Math.max(-maxOffset, Math.min(maxOffset, this.panX));
    this.panY = Math.max(-maxOffset, Math.min(maxOffset, this.panY));
  }

  resize() {
    const rect = this.canvas.parentElement.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    this.canvas.width = Math.max(1, Math.floor(rect.width * dpr));
    this.canvas.height = Math.max(1, Math.floor(rect.height * dpr));
    this.canvas.style.width = `${rect.width}px`;
    this.canvas.style.height = `${rect.height}px`;
    this.dpr = dpr;
    this.computeLayout();
  }

  computeLayout() {
    const width = this.canvas.width / (this.dpr || 1);
    const height = this.canvas.height / (this.dpr || 1);
    const padX = 10;
    const padY = 10;
    const availW = Math.max(120, width - padX * 2);
    const availH = Math.max(120, height - padY * 2);

    this.baseCellSize = Math.min(availW / this.cols, availH / this.rows, 42);
    const boardW = this.cols * this.baseCellSize;
    const boardH = this.rows * this.baseCellSize;
    this.boardOriginX = -boardW / 2;
    this.boardOriginY = -boardH / 2;
  }

  /**
   * Launch an arrow along its snake trajectory out of the board
   */
  animateArrowClear(arrow, onComplete) {
    if (this.hintArrowId === arrow.id) {
      this.hintArrowId = null;
    }
    const maxExitDist = Math.max(this.rows, this.cols) + arrow.cells.length + 3;
    const speed = Math.max(24, Math.min(42, 18 + arrow.cells.length * 1.6));
    this.slitheringArrows.set(arrow.id, {
      arrow,
      progressSteps: 0,
      maxSteps: maxExitDist,
      speedStepsPerSec: speed,
      onComplete,
    });
  }

  /**
   * Rule 2: Shake a blocked arrow in place (with its connected line) without turning it red
   */
  animateArrowShake(arrow, checkResult) {
    this.shakingArrows.set(arrow.id, {
      startTime: performance.now(),
      duration: 440,
      dir: arrow.dir,
      freeSteps: checkResult.distanceToBlocker || 0,
      blockerCell: checkResult.blockerCell || null,
    });
  }

  /**
   * Convert screen (clientX, clientY) to board grid coordinates { r, c, distFromCenter }
   */
  screenToGrid(clientX, clientY) {
    const rect = this.canvas.getBoundingClientRect();
    const sx = clientX - rect.left;
    const sy = clientY - rect.top;

    const worldX = (sx - rect.width / 2 - this.panX) / this.zoom;
    const worldY = (sy - rect.height / 2 - this.panY) / this.zoom;

    const localX = worldX - this.boardOriginX;
    const localY = worldY - this.boardOriginY;

    const cFloat = localX / this.baseCellSize - 0.5;
    const rFloat = localY / this.baseCellSize - 0.5;

    return {
      r: Math.round(rFloat),
      c: Math.round(cFloat),
      rFloat,
      cFloat,
    };
  }

  /**
   * Find the arrow closest to the tapped grid position
   */
  findArrowAtScreenPos(clientX, clientY) {
    const { rFloat, cFloat } = this.screenToGrid(clientX, clientY);

    let bestArrow = null;
    let bestDist = 0.72; // Generous touch radius in grid units

    for (const arrow of this.arrows) {
      if (arrow.removed || this.slitheringArrows.has(arrow.id)) continue;

      // Check distance to every segment of the arrow polyline
      const cells = arrow.cells;
      for (let i = 0; i < cells.length; i++) {
        const dPoint = Math.hypot(rFloat - cells[i].r, cFloat - cells[i].c);
        // Slightly prioritize arrowhead taps when fingers are close
        const headBonus = i === cells.length - 1 ? 0.92 : 1.0;
        if (dPoint * headBonus < bestDist) {
          bestDist = dPoint * headBonus;
          bestArrow = arrow;
        }
        if (i + 1 < cells.length) {
          const a = cells[i];
          const b = cells[i + 1];
          const l2 = (b.r - a.r) ** 2 + (b.c - a.c) ** 2;
          if (l2 > 0) {
            const t = Math.max(
              0,
              Math.min(1, ((rFloat - a.r) * (b.r - a.r) + (cFloat - a.c) * (b.c - a.c)) / l2)
            );
            const projR = a.r + t * (b.r - a.r);
            const projC = a.c + t * (b.c - a.c);
            const dSeg = Math.hypot(rFloat - projR, cFloat - projC);
            if (dSeg < bestDist) {
              bestDist = dSeg;
              bestArrow = arrow;
            }
          }
        }
      }
    }

    return bestArrow;
  }

  bindEvents() {
    window.addEventListener('resize', () => this.resize());

    this.canvas.addEventListener('pointerdown', e => {
      this.canvas.setPointerCapture(e.pointerId);
      this.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (this.activePointers.size === 1) {
        this.isDragging = false;
        this.dragStartX = e.clientX;
        this.dragStartY = e.clientY;
        this.initialPanX = this.panX;
        this.initialPanY = this.panY;
        this.totalPointerMove = 0;
      } else if (this.activePointers.size === 2) {
        this.isDragging = true;
        const pts = Array.from(this.activePointers.values());
        this.initialPinchDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        this.initialPinchZoom = this.zoom;
        const rect = this.canvas.getBoundingClientRect();
        this.initialPinchCenter = {
          x: (pts[0].x + pts[1].x) / 2 - rect.left,
          y: (pts[0].y + pts[1].y) / 2 - rect.top,
        };
      }
    });

    this.canvas.addEventListener('pointermove', e => {
      if (!this.activePointers.has(e.pointerId)) return;
      const prev = this.activePointers.get(e.pointerId);
      const stepMove = Math.hypot(e.clientX - prev.x, e.clientY - prev.y);
      this.totalPointerMove += stepMove;
      this.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (this.activePointers.size === 1 && !this.isDragging) {
        const dx = e.clientX - this.dragStartX;
        const dy = e.clientY - this.dragStartY;
        if (Math.hypot(dx, dy) > 8) {
          this.isDragging = true;
        }
      }

      if (this.activePointers.size === 1 && this.isDragging) {
        this.panX = this.initialPanX + (e.clientX - this.dragStartX);
        this.panY = this.initialPanY + (e.clientY - this.dragStartY);
        this.clampPan();
      } else if (this.activePointers.size === 2) {
        const pts = Array.from(this.activePointers.values());
        const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        if (this.initialPinchDist > 10) {
          const scale = dist / this.initialPinchDist;
          this.setZoom(
            this.initialPinchZoom * scale,
            this.initialPinchCenter.x,
            this.initialPinchCenter.y
          );
        }
      }
    });

    const handlePointerUp = e => {
      if (!this.activePointers.has(e.pointerId)) return;
      this.activePointers.delete(e.pointerId);

      if (this.activePointers.size === 0) {
        if (!this.isDragging && this.totalPointerMove < 12) {
          const hitArrow = this.findArrowAtScreenPos(e.clientX, e.clientY);
          if (hitArrow && this.onArrowTap) {
            this.onArrowTap(hitArrow);
          }
        }
        this.isDragging = false;
      } else if (this.activePointers.size === 1) {
        // Transition smoothly from 2-finger pinch back to 1-finger pan
        const remaining = Array.from(this.activePointers.values())[0];
        this.dragStartX = remaining.x;
        this.dragStartY = remaining.y;
        this.initialPanX = this.panX;
        this.initialPanY = this.panY;
      }
    };

    this.canvas.addEventListener('pointerup', handlePointerUp);
    this.canvas.addEventListener('pointercancel', handlePointerUp);

    // Desktop mouse wheel zoom support
    this.canvas.addEventListener(
      'wheel',
      e => {
        e.preventDefault();
        const rect = this.canvas.getBoundingClientRect();
        const factor = e.deltaY < 0 ? 1.12 : 0.89;
        this.setZoom(this.zoom * factor, e.clientX - rect.left, e.clientY - rect.top);
      },
      { passive: false }
    );
  }

  startLoop() {
    const tick = now => {
      const dt = Math.min(0.05, (now - this.lastFrameTime) / 1000);
      this.lastFrameTime = now;
      this.updateAnimations(dt, now);
      this.render(now);
      this.rafId = requestAnimationFrame(tick);
    };
    this.rafId = requestAnimationFrame(tick);
  }

  updateAnimations(dt, now) {
    // Update slithering arrows
    for (const [id, state] of this.slitheringArrows.entries()) {
      state.progressSteps += state.speedStepsPerSec * dt;
      if (state.progressSteps >= state.maxSteps) {
        this.slitheringArrows.delete(id);
        if (state.onComplete) state.onComplete(state.arrow);
      }
    }

    // Expire finished shake animations
    for (const [id, shake] of this.shakingArrows.entries()) {
      if (now - shake.startTime >= shake.duration) {
        this.shakingArrows.delete(id);
      }
    }

    if (
      this.shuffleTransition &&
      now - this.shuffleTransition.startTime >= this.shuffleTransition.duration
    ) {
      this.shuffleTransition = null;
    }
  }

  /**
   * Compute the interpolated polyline points (in grid coordinates) of an arrow
   * as it slithers forward by `progressSteps` along its own body and exit ray.
   */
  getSlitheredGridPoints(arrow, progressSteps = 0) {
    const baseCells = arrow.cells;
    const L = baseCells.length;
    if (progressSteps <= 0) {
      return {
        points: baseCells.map(c => ({ r: c.r, c: c.c })),
        dir: arrow.dir,
      };
    }

    // Build extended trajectory: tail -> ... -> head -> ray steps
    const totalNeeded = Math.ceil(progressSteps) + L + 2;
    const path = baseCells.map(c => ({ r: c.r, c: c.c }));
    const head = baseCells[L - 1];
    const { dr, dc } = arrow.dir;
    for (let k = 1; k <= totalNeeded; k++) {
      path.push({ r: head.r + k * dr, c: head.c + k * dc });
    }

    const iTail = Math.floor(progressSteps);
    const frac = progressSteps - iTail;
    const iHead = iTail + L - 1;

    const points = [];
    // Interpolated tail position
    const pTail0 = path[iTail];
    const pTail1 = path[iTail + 1];
    points.push({
      r: pTail0.r + (pTail1.r - pTail0.r) * frac,
      c: pTail0.c + (pTail1.c - pTail0.c) * frac,
    });

    // Intermediate corners along the snake body
    for (let idx = iTail + 1; idx <= iHead; idx++) {
      points.push(path[idx]);
    }

    // Interpolated head position
    if (frac > 0.0001) {
      const pHead0 = path[iHead];
      const pHead1 = path[iHead + 1];
      points.push({
        r: pHead0.r + (pHead1.r - pHead0.r) * frac,
        c: pHead0.c + (pHead1.c - pHead0.c) * frac,
      });
    }

    return {
      points,
      dir: arrow.dir,
    };
  }

  gridToWorld(r, c) {
    return {
      x: this.boardOriginX + (c + 0.5) * this.baseCellSize,
      y: this.boardOriginY + (r + 0.5) * this.baseCellSize,
    };
  }

  render(now) {
    const ctx = this.ctx;
    const dpr = this.dpr || 1;
    const width = this.canvas.width / dpr;
    const height = this.canvas.height / dpr;

    ctx.save();
    ctx.scale(dpr, dpr);

    // 1. Background fill
    const isDark = this.theme === 'dark';
    ctx.fillStyle = isDark ? '#2b3244' : '#eef2f9';
    ctx.fillRect(0, 0, width, height);

    // 2. Apply camera transform (center + pan + zoom)
    ctx.translate(width / 2 + this.panX, height / 2 + this.panY);
    ctx.scale(this.zoom, this.zoom);

    const cs = this.baseCellSize;

    // 3. Draw equal-spaced subtle dots across the board grid (Screenshot 1 & 2 style)
    const dotRadius = Math.max(1.3, cs * 0.068);
    ctx.fillStyle = isDark ? 'rgba(138, 153, 189, 0.34)' : 'rgba(110, 126, 160, 0.36)';
    ctx.beginPath();
    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        // Draw dots across the entire puzzle grid bounding area so cleared spaces & margins show the dot matrix
        const { x, y } = this.gridToWorld(r, c);
        ctx.moveTo(x + dotRadius, y);
        ctx.arc(x, y, dotRadius, 0, Math.PI * 2);
      }
    }
    ctx.fill();

    // 4. Optional Guide Lines (辅助线 button at bottom right of Screenshot 1 & 2)
    if (this.showGuideLines) {
      ctx.save();
      ctx.strokeStyle = isDark ? 'rgba(255, 255, 255, 0.14)' : 'rgba(43, 50, 68, 0.14)';
      ctx.lineWidth = Math.max(1, cs * 0.045);
      ctx.setLineDash([cs * 0.16, cs * 0.16]);
      for (const arrow of this.arrows) {
        if (arrow.removed || this.slitheringArrows.has(arrow.id)) continue;
        const headW = this.gridToWorld(arrow.head.r, arrow.head.c);
        const endR = arrow.head.r + arrow.dir.dr * Math.max(this.rows, this.cols);
        const endC = arrow.head.c + arrow.dir.dc * Math.max(this.rows, this.cols);
        const endW = this.gridToWorld(endR, endC);
        ctx.beginPath();
        ctx.moveTo(headW.x, headW.y);
        ctx.lineTo(endW.x, endW.y);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 5. Draw all active & slithering arrows
    for (const arrow of this.arrows) {
      if (arrow.removed && !this.slitheringArrows.has(arrow.id)) continue;
      this.drawSingleArrow(ctx, arrow, cs, now);
    }

    ctx.restore();
  }

  drawSingleArrow(ctx, arrow, cs, now) {
    const slitherState = this.slitheringArrows.get(arrow.id);
    const shakeState = this.shakingArrows.get(arrow.id);
    const isHinted = this.hintArrowId === arrow.id;

    let progressSteps = slitherState ? slitherState.progressSteps : 0;

    // Shake displacement (Rule 2: never turns red, vibrates & shakes visually in original color!)
    let shakeOffsetX = 0;
    let shakeOffsetY = 0;
    if (shakeState) {
      const elapsed = (now - shakeState.startTime) / 1000;
      const progress = Math.min(1, (now - shakeState.startTime) / shakeState.duration);
      const damping = Math.pow(1 - progress, 1.8);

      // Lunge slightly toward the obstacle if there is free space, plus rapid orthogonal + axial jitter
      const lungeBounce = Math.sin(progress * Math.PI) * Math.min(0.28, shakeState.freeSteps * 0.18);
      progressSteps += lungeBounce;

      const wave = Math.sin(elapsed * 58) * damping * cs * 0.18;
      const crossWave = Math.cos(elapsed * 44) * damping * cs * 0.11;
      shakeOffsetX = shakeState.dir.dc * wave + shakeState.dir.dr * crossWave;
      shakeOffsetY = shakeState.dir.dr * wave + shakeState.dir.dc * crossWave;
    }

    // Shuffle wave scale-in animation
    let scaleAlpha = 1.0;
    if (this.shuffleTransition) {
      const t = Math.min(
        1,
        (now - this.shuffleTransition.startTime) / this.shuffleTransition.duration
      );
      scaleAlpha = 0.35 + 0.65 * Math.sin((t * Math.PI) / 2);
    }

    const { points, dir } = this.getSlitheredGridPoints(arrow, progressSteps);
    if (points.length < 2) return;

    const worldPts = points.map(p => {
      const w = this.gridToWorld(p.r, p.c);
      return { x: w.x + shakeOffsetX, y: w.y + shakeOffsetY };
    });

    // Shorten the very last segment slightly so the line tucks cleanly into the arrowhead base
    const headPt = { ...worldPts[worldPts.length - 1] };
    const lineEndOffset = cs * 0.06;
    worldPts[worldPts.length - 1] = {
      x: headPt.x - dir.dc * lineEndOffset,
      y: headPt.y - dir.dr * lineEndOffset,
    };

    ctx.save();
    ctx.globalAlpha = scaleAlpha;

    const strokeWidth = Math.max(1.5, cs * 0.23);
    const cornerRadius = cs * 0.14;

    // Hint glow aura
    if (isHinted) {
      const pulse = 0.5 + 0.5 * Math.sin(now * 0.009);
      ctx.save();
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = cs * (0.55 + pulse * 0.45);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = strokeWidth * (1.45 + pulse * 0.35);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      this.traceRoundedPolyline(ctx, worldPts, cornerRadius);
      ctx.stroke();
      ctx.restore();
    }

    // Subtle drop shadow for crisp depth on dark slate background
    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, 0.28)';
    ctx.shadowBlur = cs * 0.12;
    ctx.shadowOffsetY = cs * 0.05;

    // Main arrow body stroke (always keeps arrow.color, never turns red on error!)
    ctx.strokeStyle = arrow.color;
    ctx.lineWidth = strokeWidth;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    this.traceRoundedPolyline(ctx, worldPts, cornerRadius);
    ctx.stroke();

    // Draw crisp triangular arrowhead at `headPt` pointing in `dir`
    const tipLength = cs * 0.32;
    const backLength = cs * 0.16;
    const halfWing = cs * 0.24;

    const tipX = headPt.x + dir.dc * tipLength;
    const tipY = headPt.y + dir.dr * tipLength;
    const baseCenterX = headPt.x - dir.dc * backLength;
    const baseCenterY = headPt.y - dir.dr * backLength;

    // Perpendicular vector (-dir.dr, dir.dc)
    const perpX = -dir.dr;
    const perpY = dir.dc;

    const leftX = baseCenterX + perpX * halfWing;
    const leftY = baseCenterY + perpY * halfWing;
    const rightX = baseCenterX - perpX * halfWing;
    const rightY = baseCenterY - perpY * halfWing;

    ctx.fillStyle = arrow.color;
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(leftX, leftY);
    ctx.lineTo(rightX, rightY);
    ctx.closePath();
    ctx.fill();
    ctx.lineWidth = Math.max(1.2, cs * 0.06);
    ctx.strokeStyle = arrow.color;
    ctx.stroke();
    ctx.restore();

    // If hinted, draw a subtle white inner highlight core
    if (isHinted) {
      const pulse = 0.5 + 0.5 * Math.sin(now * 0.009);
      ctx.strokeStyle = `rgba(255, 255, 255, ${0.45 + pulse * 0.45})`;
      ctx.lineWidth = strokeWidth * 0.42;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      this.traceRoundedPolyline(ctx, worldPts, cornerRadius);
      ctx.stroke();
    }

    ctx.restore();
  }

  /**
   * Trace a polyline with smooth rounded 90-degree corners matching Screenshot 2
   */
  traceRoundedPolyline(ctx, pts, radius) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length - 1; i++) {
      const prev = pts[i - 1];
      const cur = pts[i];
      const next = pts[i + 1];
      const d1 = Math.hypot(cur.x - prev.x, cur.y - prev.y);
      const d2 = Math.hypot(next.x - cur.x, next.y - cur.y);
      const r = Math.min(radius, d1 * 0.45, d2 * 0.45);
      if (r > 0.5) {
        ctx.arcTo(cur.x, cur.y, next.x, next.y, r);
      } else {
        ctx.lineTo(cur.x, cur.y);
      }
    }
    const last = pts[pts.length - 1];
    ctx.lineTo(last.x, last.y);
  }
}

      />
