<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2b3244" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>一箭又一箭 · 纯净定制版</title>
    
    <style>
/* ==========================================================================
   《一箭又一箭》 纯净定制版 (Arrow by Arrow - Custom Edition)
   Combines Mahjong Titan's classic Top Toolbar, Boards List & 3-Star Modal
   with 《一箭又一箭》's Deep Slate Aesthetic, Day/Night Switch & Zoom Controls
   ========================================================================== */

:root {
  --bg-dark: #2b3244;
  --bg-darker: #1d222f;
  --bg-light: #eef2f9;
  --toolbar-bg: #22252a;
  --toolbar-border: #3a3f48;
  --card-bg: rgba(30, 34, 42, 0.96);
  --accent-red: #c92a2a;
  --gold-top: #ffe659;
  --gold-mid: #f7b500;
  --gold-bot: #d48800;
  --text-main: #f3f6fc;
  --text-muted: #9aa5b8;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #12151e;
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  touch-action: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

#app {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-dark);
}

/* On desktop/landscape screens, lock #app to 9:16 portrait mobile aspect ratio */
@media (min-aspect-ratio: 10/15) {
  #app {
    height: 100vh;
    width: calc(100vh * 9 / 16);
    max-width: 100vw;
    box-shadow: 0 0 48px rgba(0, 0, 0, 0.75);
    border-left: 1px solid rgba(255, 255, 255, 0.08);
    border-right: 1px solid rgba(255, 255, 255, 0.08);
  }
}

#app.theme-light {
  background: var(--bg-light);
  color: #242b3a;
}

/* ==========================================================================
   1. TOP NAVIGATION / ACTION TOOLBAR (Mahjong Titan Screenshot 3 & 5 Style)
   ========================================================================== */

.mt-topbar {
  padding-top: var(--safe-top);
  height: calc(56px + var(--safe-top));
  background: linear-gradient(180deg, #32363e 0%, #1c1e22 100%);
  border-bottom: 1px solid #454a54;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  z-index: 30;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
}

.mt-nav-btn {
  background: transparent;
  border: none;
  border-right: 1px solid rgba(255, 255, 255, 0.1);
  color: #f0f3f8;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  transition: background 0.15s, transform 0.1s;
}

.mt-nav-btn:last-child {
  border-right: none;
}

.mt-nav-btn:active {
  background: rgba(255, 255, 255, 0.12);
  transform: scale(0.96);
}

.mt-nav-btn.active-tab {
  color: #ff4d4d;
  background: rgba(255, 77, 77, 0.08);
}

.mt-nav-btn svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
}

/* ==========================================================================
   2. IN-GAME STATUS SUBHEADER (《一箭又一箭》 + Expected Time + Live Stars)
   ========================================================================== */

.game-subheader {
  height: 54px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(34, 40, 56, 0.88);
  border-bottom: 1px solid rgba(255, 255, 255, 0.09);
  backdrop-filter: blur(8px);
  z-index: 20;
  flex-shrink: 0;
}

#app.theme-light .game-subheader {
  background: rgba(235, 240, 249, 0.92);
  border-bottom: 1px solid rgba(0, 0, 0, 0.08);
  color: #242b3a;
}

.subheader-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-square-btn {
  width: 36px;
  height: 36px;
  border-radius: 9px;
  border: 1.5px solid rgba(110, 197, 184, 0.45);
  background: rgba(43, 50, 68, 0.85);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

#app.theme-light .icon-square-btn {
  background: #ffffff;
  color: #2b3244;
  border-color: rgba(94, 199, 184, 0.65);
}

/* Day / Night Pill Switch matching Screenshot 1 & 2 */
.theme-pill {
  width: 62px;
  height: 32px;
  border-radius: 16px;
  background: #4e6794;
  border: none;
  position: relative;
  cursor: pointer;
  padding: 3px;
  display: flex;
  align-items: center;
  transition: background 0.25s;
}

#app.theme-light .theme-pill {
  background: #87b5f5;
}

.theme-pill-knob {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #2f3b56;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  transform: translateX(30px);
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.25s;
}

#app.theme-light .theme-pill-knob {
  background: #ffffff;
  transform: translateX(0px);
}

.subheader-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1.15;
}

.level-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  font-weight: 700;
}

.live-stars-mini {
  display: inline-flex;
  gap: 3px;
}

.live-star-dot {
  font-size: 14px;
  color: #5c6475;
  transition: color 0.25s, transform 0.25s;
}

.live-star-dot.eligible {
  color: #ffd43b;
  text-shadow: 0 0 6px rgba(255, 212, 59, 0.45);
}

.timer-row {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: #d9e2f2;
  margin-top: 2px;
}

#app.theme-light .timer-row {
  color: #3b465e;
}

.timer-expected {
  font-size: 11px;
  color: #8fa0be;
  font-weight: 500;
}

.timer-overtime {
  color: #f2c94c;
}

.subheader-right {
  display: flex;
  align-items: center;
  gap: 6px;
}

.combo-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.08);
  color: #9fb0cd;
  font-variant-numeric: tabular-nums;
  transition: transform 0.2s, background 0.2s, color 0.2s, box-shadow 0.2s;
}

.combo-badge.combo-active {
  background: rgba(110, 181, 235, 0.18);
  color: #ffffff;
}

.combo-badge.combo-rainbow {
  background: linear-gradient(90deg, #ff5e7e, #ffb347, #5ec7b8, #8c7ae6);
  color: #ffffff;
  box-shadow: 0 0 10px rgba(255, 179, 71, 0.55);
  transform: scale(1.06);
}

#app.theme-light .combo-badge {
  background: rgba(43, 50, 68, 0.08);
  color: #4b5770;
}

#app.theme-light .combo-badge.combo-active {
  background: rgba(78, 137, 219, 0.18);
  color: #1f293d;
}

.remain-badge {
  font-size: 12px;
  font-weight: 600;
  padding: 5px 9px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.09);
  color: #ced8ea;
  font-variant-numeric: tabular-nums;
}

#app.theme-light .remain-badge {
  background: rgba(43, 50, 68, 0.09);
  color: #2b3244;
}

/* ==========================================================================
   3. CANVAS PLAY AREA & BOTTOM ZOOM BAR (Screenshot 1 & 2 Style)
   ========================================================================== */

.canvas-stage {
  position: relative;
  flex: 1;
  width: 100%;
  overflow: hidden;
}

#boardCanvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: pointer;
}

/* Subtle non-intrusive toast notification */
.status-toast {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%) translateY(-10px);
  background: rgba(22, 26, 36, 0.9);
  color: #f8fafc;
  padding: 7px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid rgba(255, 255, 255, 0.14);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.22s, transform 0.22s;
  z-index: 25;
  white-space: nowrap;
}

.status-toast.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.bottom-bar {
  padding-bottom: var(--safe-bottom);
  height: calc(64px + var(--safe-bottom));
  padding-left: 14px;
  padding-right: 14px;
  background: rgba(34, 40, 56, 0.92);
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 20;
  flex-shrink: 0;
}

#app.theme-light .bottom-bar {
  background: rgba(235, 240, 249, 0.94);
  border-top: 1px solid rgba(0, 0, 0, 0.08);
}

.round-tool-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: none;
  border: none;
  color: #e2e8f0;
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  min-width: 52px;
}

#app.theme-light .round-tool-btn {
  color: #2b3244;
}

.round-tool-circle {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1.5px solid rgba(94, 199, 184, 0.55);
  background: rgba(43, 50, 68, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #5ec7b8;
  transition: transform 0.12s, background 0.2s, box-shadow 0.2s;
}

#app.theme-light .round-tool-circle {
  background: #ffffff;
}

.round-tool-btn.active .round-tool-circle {
  background: rgba(94, 199, 184, 0.22);
  box-shadow: 0 0 12px rgba(94, 199, 184, 0.45);
}

.round-tool-btn:active .round-tool-circle {
  transform: scale(0.92);
}

/* Zoom Pill Bar in center of bottom toolbar matching Screenshot 1 & 2 */
.zoom-pill-bar {
  flex: 1;
  max-width: 280px;
  height: 40px;
  background: rgba(58, 67, 88, 0.72);
  border-radius: 20px;
  padding: 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

#app.theme-light .zoom-pill-bar {
  background: rgba(195, 206, 226, 0.65);
}

.zoom-step-btn {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: none;
  background: #dce4f2;
  color: #2b3244;
  font-size: 16px;
  font-weight: 800;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}

.zoom-step-btn:active {
  transform: scale(0.9);
}

.zoom-slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 6px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.32);
  outline: none;
}

.zoom-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #ffffff;
  border: 3px solid #5ec7b8;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
}

/* ==========================================================================
   4. BOARDS LIST OVERLAY (Mahjong Titan Screenshot 3 Style)
   ========================================================================== */

.overlay-panel {
  position: absolute;
  inset: 0;
  background: #1e2024;
  z-index: 40;
  display: flex;
  flex-direction: column;
  transition: opacity 0.2s, transform 0.2s;
}

.overlay-panel.hidden {
  opacity: 0;
  pointer-events: none;
  transform: translateY(10px);
}

.boards-filter-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  height: 40px;
  background: #282b30;
  border-bottom: 1px solid #3c4048;
  flex-shrink: 0;
}

.filter-tab-btn {
  border: none;
  background: transparent;
  color: #cfd4de;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border-right: 1px solid #3c4048;
  transition: background 0.15s, color 0.15s;
}

.filter-tab-btn:last-child {
  border-right: none;
}

.filter-tab-btn.active {
  background: linear-gradient(180deg, #d63333 0%, #a61e1e 100%);
  color: #ffffff;
}

.boards-summary-strip {
  padding: 8px 16px;
  background: #23262b;
  border-bottom: 1px solid #343840;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  color: #aeb6c4;
}

.total-stars-pill {
  background: #16181c;
  border: 1px solid #494e58;
  padding: 3px 10px;
  border-radius: 6px;
  color: #ffffff;
  font-weight: 700;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.total-stars-pill span {
  color: #ffd43b;
}

.boards-list-scroll {
  flex: 1;
  overflow-y: auto;
  touch-action: pan-y;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(24px + var(--safe-bottom));
}

.board-row-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  min-height: 64px;
  background: #282b30;
  border-bottom: 2px solid #1b1d21;
  cursor: pointer;
  transition: background 0.12s;
}

.board-row-item:hover,
.board-row-item:active {
  background: #343840;
}

.board-row-item.current-level {
  border-left: 4px solid #f7b500;
}

.board-row-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.board-thumb-canvas {
  width: 50px;
  height: 50px;
  border-radius: 4px;
  background: #3d4047;
  flex-shrink: 0;
}

.board-row-info {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.board-row-number {
  font-size: 18px;
  font-weight: 600;
  color: #f1f5f9;
  display: flex;
  align-items: center;
  gap: 8px;
}

.board-row-subtitle {
  font-size: 12px;
  color: #94a3b8;
}

.board-row-stars {
  display: flex;
  align-items: center;
  gap: 6px;
}

.row-star-icon {
  width: 24px;
  height: 24px;
}

/* ==========================================================================
   5. VICTORY MODAL & 3-STAR SLAM ANIMATION (Mahjong Titan Screenshot 4 Style)
   ========================================================================== */

.victory-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(15, 18, 26, 0.78);
  backdrop-filter: blur(5px);
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  transition: opacity 0.25s;
}

.victory-backdrop.hidden {
  opacity: 0;
  pointer-events: none;
}

.victory-top-stats {
  position: absolute;
  top: calc(14px + var(--safe-top));
  left: 16px;
  right: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 20px;
  font-weight: 600;
  color: #ffffff;
}

.victory-card {
  width: 100%;
  max-width: 390px;
  background: rgba(36, 39, 46, 0.96);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 8px;
  padding: 28px 18px 22px;
  box-shadow: 0 18px 42px rgba(0, 0, 0, 0.65);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}

.victory-stars-grid {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  text-align: center;
}

.victory-star-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.star-slot-wrap {
  position: relative;
  width: 78px;
  height: 78px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.star-svg-base {
  width: 72px;
  height: 72px;
  filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.45));
}

/* Animated golden star that slams in from scale(2.4) like Screenshot 4! */
.star-svg-lit {
  position: absolute;
  width: 72px;
  height: 72px;
  opacity: 0;
  transform: scale(2.45) rotate(-12deg);
  filter: drop-shadow(0 0 16px rgba(255, 215, 0, 0.75));
  pointer-events: none;
}

.star-svg-lit.animate-in {
  animation: starSlamLight 0.55s cubic-bezier(0.22, 1.28, 0.36, 1) forwards;
}

@keyframes starSlamLight {
  0% {
    opacity: 0;
    transform: scale(2.5) rotate(-14deg);
  }
  45% {
    opacity: 0.85;
    transform: scale(1.35) rotate(4deg);
  }
  75% {
    opacity: 1;
    transform: scale(0.92) rotate(-2deg);
  }
  100% {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }
}

.star-cond-label {
  font-size: 13px;
  line-height: 1.35;
  color: #e2e8f0;
  font-weight: 500;
}

.star-cond-sub {
  font-size: 12px;
  color: #94a3b8;
}

/* Mahjong Titan Glossy Gold Pill Buttons (Screenshot 4) */
.victory-btn-row {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.mt-gold-btn {
  height: 44px;
  border-radius: 22px;
  border: 1px solid #ffd43b;
  background: linear-gradient(180deg, #ffe866 0%, #f5b400 55%, #df9400 100%);
  color: #1a1608;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.7);
  transition: transform 0.1s, filter 0.15s;
}

.mt-gold-btn:active {
  transform: scale(0.95);
  filter: brightness(0.93);
}

.victory-goal-banner {
  margin-top: 16px;
  width: 100%;
  max-width: 390px;
  background: rgba(34, 37, 44, 0.92);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 6px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: #f1f5f9;
}

/* Options / Goals inner container */
.settings-content {
  padding: 20px 16px;
  max-width: 480px;
  width: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow-y: auto;
}

.setting-card {
  background: #282b30;
  border: 1px solid #383c44;
  border-radius: 8px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.setting-card-title {
  font-size: 15px;
  font-weight: 600;
  color: #f1f5f9;
}

.setting-card-desc {
  font-size: 12px;
  color: #94a3b8;
  margin-top: 3px;
}

.toggle-btn {
  padding: 7px 16px;
  border-radius: 16px;
  border: none;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  background: #4b5563;
  color: #ffffff;
}

.toggle-btn.on {
  background: #5ec7b8;
  color: #112220;
}

</style>

  <body>
    <div id="app">
      <!-- ================================================================
           1. TOP ACTION BAR (Mahjong Titan Screenshot 5 Style)
           ================================================================ -->
      <header class="mt-topbar">
        <button id="btnHint" class="mt-nav-btn" title="提示下一条可移除的箭头">
          <svg viewBox="0 0 24 24">
            <path
              d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"
            />
          </svg>
          <span>提示 (Hint)</span>
        </button>

        <button id="btnShuffle" class="mt-nav-btn" title="重新排列画面剩余未消除的箭头">

    <script>
(function() {
// === [src/engine/patterns.js] ===
/**
 * 26 English Alphabet Levels (A - Z) for 《一箭又一箭》 (Arrow by Arrow)
 * Each level is sculpted in the shape of a bold capital letter A..Z on a 34x28 grid,
 * tuned for < 100 arrows per board with high length variance (short 2-4 cell lock arrows
 * + medium 8-15 cell winding arrows + long 18-38 cell tortuous multi-bend snakes).
 */
function sanitizeMask(mask) {
  const R = mask.length;
  const C = mask[0].length;
  const out = mask.map(row => [...row]);

  let changed = true;
  let guard = 0;
  while (changed && guard++ < 8) {
    changed = false;
    for (let r = 0; r < R; r++) {
      for (let c = 0; c < C; c++) {
        if (out[r][c] === 1) {
          let neighbors = 0;
          if (r > 0 && out[r - 1][c] === 1) neighbors++;
          if (r < R - 1 && out[r + 1][c] === 1) neighbors++;
          if (c > 0 && out[r][c - 1] === 1) neighbors++;
          if (c < C - 1 && out[r][c + 1] === 1) neighbors++;
          if (neighbors === 0) {
            out[r][c] = 0;
            changed = true;
          }
        }
      }
    }
  }
  return out;
}

function buildLetterMask(rows, cols, shapeFn) {
  const mask = Array.from({ length: rows }, (_, r) =>
    Array.from({ length: cols }, (_, c) => {
      if (r === 0 || r === rows - 1 || c === 0 || c === cols - 1) return 0;
      const ny = ((r - 1) / (rows - 3)) * 2 - 1; // -1 (top) .. +1 (bottom)
      const nx = ((c - 1) / (cols - 3)) * 2 - 1; // -1 (left) .. +1 (right)
      return shapeFn(nx, ny, r, c, rows, cols) ? 1 : 0;
    })
  );
  return sanitizeMask(mask);
}

/**
 * Signed distance from (px, py) to segment (ax, ay) -> (bx, by)
 */
function sdSegment(px, py, ax, ay, bx, by) {
  const pax = px - ax;
  const pay = py - ay;
  const bax = bx - ax;
  const bay = by - ay;
  const h = Math.max(0, Math.min(1, (pax * bax + pay * bay) / (bax * bax + bay * bay || 1)));
  return Math.hypot(pax - bax * h, pay - bay * h);
}

/**
 * Axis-aligned box check: |x - cx| <= hx && |y - cy| <= hy
 */
function inBox(px, py, cx, cy, hx, hy) {
  return Math.abs(px - cx) <= hx && Math.abs(py - cy) <= hy;
}

/**
 * Elliptical ring check
 */
function inRing(px, py, cx, cy, rx, ry, innerRatio = 0.42) {
  const d = Math.hypot((px - cx) / rx, (py - cy) / ry);
  return d <= 1.0 && d >= innerRatio;
}

/**
 * 26 Bold Capital Letters A - Z
 * Stroke thickness is generous (~0.48 to 0.56 in normalized [-1,1] space, i.e. 6-8 grid cells wide)
 * so long snakes can coil and make multiple 90-degree switchbacks inside every stroke!
 */
const ALPHABET_SHAPES = [
  {
    letter: 'A',
    title: '字母 A · 巅峰金字塔',
    expectedSeconds: 240,
    fn: (x, y) => {
      const leftLeg = sdSegment(x, y, -0.06, -0.76, -0.68, 0.8) <= 0.27;
      const rightLeg = sdSegment(x, y, 0.06, -0.76, 0.68, 0.8) <= 0.27;
      const crossbar = inBox(x, y, 0, 0.22, 0.56, 0.21);
      const topCrown = inBox(x, y, 0, -0.72, 0.34, 0.2);
      const hole = Math.abs(x) <= (y + 0.38) * 0.36 && y > -0.35 && y < 0.02;
      return (leftLeg || rightLeg || crossbar || topCrown) && !hole;
    },
  },
  {
    letter: 'B',
    title: '字母 B · 经典双环迷阵',
    expectedSeconds: 300,
    fn: (x, y) => {
      const leftSpine = x >= -0.88 && x <= -0.22 && Math.abs(y) <= 0.92;
      const topLoop =
        Math.hypot((x + 0.06) * 0.9, (y + 0.45) * 1.1) <= 0.64 &&
        Math.hypot((x + 0.02) * 1.05, (y + 0.45) * 1.15) >= 0.22;
      const botLoop =
        Math.hypot((x + 0.03) * 0.86, (y - 0.45) * 1.1) <= 0.68 &&
        Math.hypot((x + 0.0) * 1.05, (y - 0.45) * 1.15) >= 0.24;
      const topBar = y >= -0.92 && y <= -0.62 && x >= -0.88 && x <= 0.36;
      const midBar = Math.abs(y) <= 0.18 && x >= -0.88 && x <= 0.42;
      const botBar = y >= 0.62 && y <= 0.92 && x >= -0.88 && x <= 0.45;
      return leftSpine || topLoop || botLoop || topBar || midBar || botBar;
    },
  },
  {
    letter: 'C',
    title: '字母 C · 新月弯弓',
    expectedSeconds: 260,
    fn: (x, y) => {
      const ring = inRing(x, y, 0.04, 0, 0.92, 0.94, 0.3);
      const opening = x > 0.28 && Math.abs(y) < 0.28;
      const topSerif = inBox(x, y, 0.56, -0.52, 0.32, 0.26);
      const botSerif = inBox(x, y, 0.56, 0.52, 0.32, 0.26);
      return (ring && !opening) || topSerif || botSerif;
    },
  },
  {
    letter: 'D',
    title: '字母 D · 圣殿巨盾',
    expectedSeconds: 270,
    fn: (x, y) => {
      const spine = inBox(x, y, -0.56, 0, 0.32, 0.92);
      const arc = inRing(x, y, -0.12, 0, 0.96, 0.92, 0.38) && x >= -0.35;
      const topBar = inBox(x, y, -0.25, -0.7, 0.52, 0.22);
      const botBar = inBox(x, y, -0.25, 0.7, 0.52, 0.22);
      const innerHole = x > -0.22 && Math.hypot((x + 0.15) / 0.42, y / 0.42) < 0.85;
      return (spine || arc || topBar || botBar) && !innerHole;
    },
  },
  {
    letter: 'E',
    title: '字母 E · 三重回廊',
    expectedSeconds: 270,
    fn: (x, y) => {
      const spine = inBox(x, y, -0.56, 0, 0.32, 0.92);
      const topBar = inBox(x, y, 0.02, -0.7, 0.86, 0.22);
      const midBar = inBox(x, y, -0.06, 0, 0.72, 0.21);
      const botBar = inBox(x, y, 0.02, 0.7, 0.86, 0.22);
      return spine || topBar || midBar || botBar;
    },
  },
  {
    letter: 'F',
    title: '字母 F · 双翼旌旗',
    expectedSeconds: 240,
    fn: (x, y) => {
      const spine = inBox(x, y, -0.52, 0, 0.34, 0.92);
      const topBar = inBox(x, y, 0.04, -0.68, 0.86, 0.24);
      const midBar = inBox(x, y, -0.04, -0.02, 0.72, 0.22);
      const foot = inBox(x, y, -0.42, 0.74, 0.44, 0.18);
      return spine || topBar || midBar || foot;
    },
  },
  {
    letter: 'G',
    title: '字母 G · 旋涡引力',
    expectedSeconds: 300,
    fn: (x, y) => {
      const ring = inRing(x, y, 0.02, 0, 0.9, 0.92, 0.36);
      const gap = x > 0.18 && y < -0.06 && y > -0.42;
      const shelf = inBox(x, y, 0.38, 0.12, 0.5, 0.21);
      const spur = inBox(x, y, 0.62, 0.42, 0.26, 0.38);
      return (ring && !gap) || shelf || spur;
    },
  },
  {
    letter: 'H',
    title: '字母 H · 双子天桥',
    expectedSeconds: 280,
    fn: (x, y) => {
      const leftPillar = inBox(x, y, -0.58, 0, 0.32, 0.92);
      const rightPillar = inBox(x, y, 0.58, 0, 0.32, 0.92);
      const bridge = inBox(x, y, 0, 0, 0.65, 0.25);
      return leftPillar || rightPillar || bridge;
    },
  },
  {
    letter: 'I',
    title: '字母 I · 擎天圣柱',
    expectedSeconds: 260,
    fn: (x, y) => {
      const topCap = inBox(x, y, 0, -0.66, 0.88, 0.28);
      const pillar = inBox(x, y, 0, 0, 0.46, 0.92);
      const botCap = inBox(x, y, 0, 0.66, 0.88, 0.28);
      return topCap || pillar || botCap;
    },
  },
  {
    letter: 'J',
    title: '字母 J · 沧海钩戟',
    expectedSeconds: 260,
    fn: (x, y) => {
      const topCap = inBox(x, y, 0.12, -0.66, 0.78, 0.28);
      const stem = inBox(x, y, 0.32, -0.04, 0.42, 0.72);
      const hook = inRing(x, y, -0.06, 0.36, 0.82, 0.58, 0.26) && y >= 0.06;
      const leftTip = inBox(x, y, -0.56, 0.2, 0.34, 0.3);
      return topCap || stem || hook || leftTip;
    },
  },
  {
    letter: 'K',
    title: '字母 K · 破晓战戟',
    expectedSeconds: 300,
    fn: (x, y) => {
      const spine = inBox(x, y, -0.56, 0, 0.32, 0.92);
      const upperArm = sdSegment(x, y, -0.25, 0.05, 0.64, -0.74) <= 0.28;
      const lowerArm = sdSegment(x, y, -0.2, -0.05, 0.64, 0.74) <= 0.28;
      const knot = inBox(x, y, -0.2, 0, 0.32, 0.24);

  {
    letter: 'L',
    title: '字母 L · 铁壁角楼',
    expectedSeconds: 260,

/**
 * Solver & Collision Detection Engine for 《一箭又一箭》
 */

/**
 * Build a fast lookup map from "r,c" (or r * cols + c) to arrow.id
 */
function buildOccupancyGrid(arrows, rows, cols) {
  const grid = new Int32Array(rows * cols).fill(-1);
  for (let i = 0; i < arrows.length; i++) {
    const arrow = arrows[i];
    if (arrow.removed) continue;
    for (const cell of arrow.cells) {
      if (cell.r >= 0 && cell.r < rows && cell.c >= 0 && cell.c < cols) {
        grid[cell.r * cols + cell.c] = arrow.id;
      }
    }
  }
  return grid;
}

/**
 * Check if a specific arrow can exit the board without hitting any other active arrow.
 * Returns { canExit: boolean, blockerId: number|null, blockerCell: {r,c}|null, distanceToBlocker: number }
 */
function checkArrowExit(arrow, activeArrows, rows, cols, prebuiltGrid = null) {
  const grid = prebuiltGrid || buildOccupancyGrid(activeArrows, rows, cols);
  const { r: hr, c: hc } = arrow.head;
  const { dr, dc } = arrow.dir;

  let step = 1;
  while (true) {
    const nr = hr + step * dr;
    const nc = hc + step * dc;
    if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) {
      return {
        canExit: true,
        blockerId: null,
        blockerCell: null,
        distanceToBlocker: step,
      };
    }
    const occupantId = grid[nr * cols + nc];
    if (occupantId !== -1) {
      return {
        canExit: false,
        blockerId: occupantId,
        blockerCell: { r: nr, c: nc },
        distanceToBlocker: step - 1,
      };
    }
    step++;
  }
}

/**
 * Return all currently removable (unblocked) arrows.
 */
function getRemovableArrows(activeArrows, rows, cols) {
  const remaining = activeArrows.filter(a => !a.removed);
  const grid = buildOccupancyGrid(remaining, rows, cols);
  return remaining.filter(arrow => checkArrowExit(arrow, remaining, rows, cols, grid).canExit);
}

/**
 * Pick one random removable arrow for the Hint feature.
 */
function getRandomHintArrow(activeArrows, rows, cols, rng = Math.random) {
  const removable = getRemovableArrows(activeArrows, rows, cols);
  if (removable.length === 0) return null;
  const idx = Math.floor(rng() * removable.length);
  return removable[idx];
}

/**
 * Verify that a set of arrows is 100% solvable from start to finish (zero deadlock).
 * Also returns a valid solution sequence of arrow IDs and complexity metrics.
 */
function verifySolvable(arrows, rows, cols) {
  const pool = arrows.filter(a => !a.removed).map(a => ({ ...a, removed: false }));
  const total = pool.length;
  const sequence = [];
  let layers = 0;

  while (sequence.length < total) {
    const grid = buildOccupancyGrid(pool, rows, cols);
    const removableNow = [];
    for (const arrow of pool) {
      if (arrow.removed) continue;
      if (checkArrowExit(arrow, pool, rows, cols, grid).canExit) {
        removableNow.push(arrow);
      }
    }
    if (removableNow.length === 0) {
      return {
        solvable: false,
        clearedCount: sequence.length,
        totalCount: total,
        sequence,
        layers,
      };
    }
    layers++;
    for (const arrow of removableNow) {
      arrow.removed = true;
      sequence.push(arrow.id);
    }
  }

  return {
    solvable: true,
    clearedCount: sequence.length,
    totalCount: total,
    sequence,
    layers,
  };
}

    const dc1 = cells[i].c - cells[i - 1].c;

 * - 'STRAIGHT': 0 turns (pure straight pin or long spear)
 * - 'L_BEND': 1 turn (L-shaped corridor)
 * - 'PAPERCLIP': >= 3 turns where consecutive same-chirality turns form a spiral / paperclip coil
 * - 'U_BEND': >= 2 turns dominated by same-chirality U-channel / hairpin foldback
 * - 'SERPENT': alternating left-right S-turns

function classifyArrowShape(cells) {
  const turnSigns = [];
  let prevDir = null;
  for (let i = 1; i < cells.length; i++) {
    const curDir = {
      dr: cells[i].r - cells[i - 1].r,
      dc: cells[i].c - cells[i - 1].c,

    if (prevDir && (curDir.dr !== prevDir.dr || curDir.dc !== prevDir.dc)) {
      turnSigns.push(turnCross(prevDir, curDir));
    }
    prevDir = curDir;
  }

  const t = turnSigns.length;
  if (t === 0) return 'STRAIGHT';
  if (t === 1) return 'L_BEND';

  // Count consecutive same-sign turn pairs (e.g. R->R or L->L) vs alternating pairs (R->L or L->R)
  let sameSignPairs = 0;
  let maxSameRun = 1;
  let curRun = 1;
  for (let i = 1; i < t; i++) {
    if (turnSigns[i] === turnSigns[i - 1]) {
      sameSignPairs++;
      curRun++;
      if (curRun > maxSameRun) maxSameRun = curRun;
    } else {
      curRun = 1;
    }
  }

  if (maxSameRun >= 3 || (t >= 3 && sameSignPairs >= t - 2)) {

  if (maxSameRun >= 2 || sameSignPairs * 2 >= t - 1) {

        const nextDeg = countNeighbors(nr, nc, rows, cols, unvisited);
        unvisited[nIdx] = 1;

        if (isolatesOther) continue;

        const isStraight = prevDir && dr === prevDir.dr && dc === prevDir.dc;
        const cross = prevDir ? turnCross(prevDir, { dr, dc }) : 0;

        let score = rng() * 1.5;
        // Wall-hugging bonus: classic mazes love hugging boundaries (nextDeg == 1 or 2)
        if (nextDeg === 1 || nextDeg === 2) score += 6.0;

        if (!prevDir) {
          score += 5.0;
        } else if (carverMode === 'SPIRAL_ROOM') {
          if (isStraight && straightSteps < legTarget) {
            score += 18.0;
          } else if (cross === lockedSpin) {
            // Turn in the locked spiral direction (Paperclip / U-bend)!
            score += straightSteps >= 2 ? 22.0 : 8.0;
          } else if (cross === -lockedSpin) {
            // Strongly penalize opposite turn so it coils into a paperclip instead of an S-wave!
            score -= 18.0;
          }
        } else if (carverMode === 'PERIMETER_LU') {
          if (isStraight && straightSteps < legTarget) {
            score += 24.0;
          } else if (cross === lockedSpin) {
            score += 16.0;
          } else {
            score -= 14.0;
          }
        } else {
          // CHICANE mode
          if (isStraight && straightSteps < legTarget) {
            score += 12.0;
          } else if (!isStraight) {
            score += 14.0;
          }
        }

        options.push({ nr, nc, nIdx, dr, dc, isStraight, score });
      }

      if (options.length === 0) break;
      options.sort((a, b) => b.score - a.score);
      const pick = options[0];

      addMazeEdge(curIdx, pick.nIdx);
      unvisited[pick.nIdx] = 0;
      remainingCount--;

      if (pick.isStraight) {
        straightSteps++;
      } else {
        straightSteps = 1;
        if (carverMode === 'SPIRAL_ROOM') {
          // Gradually tighten or vary the spiral leg length as it coils inward
          legTarget = Math.max(2, legTarget - (rng() < 0.6 ? 1 : 0));
        }
      }
      prevDir = { dr: pick.dr, dc: pick.dc };
      curR = pick.nr;
      curC = pick.nc;
      curIdx = pick.nIdx;
    }
  }

  return mazeAdj;
}

/**
 * Sample a target cut length along the maze corridor:
 * Designed to match Image 3 (Letter B) with ~65 - 88 arrows per board:
 * - ~25% Short Cuts (2 - 4 cells: straight pins & tight L/U hooks)
 * - ~42% Medium Cuts (5 - 12 cells: L-bends, U-channels, compact paperclips)
 * - ~33% Long Cuts (13 - 28 cells: large paperclip spirals, deep U-loops, long L-corridors)
 */
function sampleMazeCutLength(rng, stepIndex, minLen = 2, maxLen = 28) {
  const roll = (stepIndex * 0.381966 + rng() * 0.32) % 1.0;
  if (roll < 0.25) {
    const lo = Math.max(2, minLen);
    const hi = Math.min(4, maxLen);
    return lo + Math.floor(rng() * (hi - lo + 1));
  } else if (roll < 0.67) {
    const lo = Math.max(minLen, Math.min(5, maxLen));
    const hi = Math.max(lo, Math.min(12, maxLen));
    return lo + Math.floor(rng() * (hi - lo + 1));
  } else {
    const lo = Math.max(minLen, Math.min(13, maxLen));
    const hi = Math.max(lo, Math.min(28, maxLen));
    return lo + Math.floor(rng() * (hi - lo + 1));
  }
}

/**
 * Sample a Geometric Motif for cutting/extending along the maze:
 * - 'STRAIGHT' (16%): 0 turns (pure straight arrow)
 * - 'L_BEND' (24%): 1 turn (clean L-shaped arrow)
 * - 'U_BEND' (24%): 2 same-chirality turns (U-channel / hairpin foldback)
 * - 'PAPERCLIP' (24%): 3-6 same-chirality turns (inward-coiling paperclip spiral!)
 * - 'SERPENT' (12%): alternating turns (S-bend, kept low!)
 */
function sampleCutMotif(rng, stepIndex) {
  const roll = (stepIndex * 0.29 + rng() * 0.71) % 1.0;
  if (roll < 0.16) return 'STRAIGHT';
  if (roll < 0.40) return 'L_BEND';
  if (roll < 0.64) return 'U_BEND';
  if (roll < 0.88) return 'PAPERCLIP';
  return 'SERPENT';
}

/**
 * ============================================================================
 * STAGE 2: TRACE & CUT ALONG THE CLASSIC MAZE (`sliceMazeCorridor`)
 * Starting from the cut opening `chosen = (hr, hc) <- (pr, pc)`, follows the
 * Classic Maze edges `mazeAdj` backwards (and extends with the chosen motif
 * when a maze edge was already cut) to slice out a clean arrow!
 * ============================================================================
 */
function sliceMazeCorridor({
  chosen,
  targetLen,
  motif,
  rows,
  cols,
  remaining,
  mazeAdj,
  shadowedByFixed,
  rng,
}) {
  const path = [
    { r: chosen.hr, c: chosen.hc, idx: chosen.hIdx },
    { r: chosen.pr, c: chosen.pc, idx: chosen.pIdx },
  ];

  remaining[chosen.hIdx] = 0;
  remaining[chosen.pIdx] = 0;

  let bestPath = path.map(p => ({ ...p }));
  let bestScore = -1e9;

  // Determine the max allowed turns for this motif
  const maxMotifTurns =
    motif === 'STRAIGHT'
      ? 0
      : motif === 'L_BEND'
        ? 1
        : motif === 'U_BEND'
          ? 2
          : 6;

  // Lock a rotational chirality (+1 clockwise or -1 counter-clockwise) for U_BEND & PAPERCLIP!
  const lockedSpin = rng() < 0.5 ? 1 : -1;

  const evaluateCutPath = (curPath, turns, sameSpinTurns, oppSpinTurns, mazeEdgesUsed) => {
    for (let k = 1; k < curPath.length; k++) {
      const pt = curPath[k];
      if (createsIsolatedNeighbor(pt.r, pt.c, rows, cols, remaining, -1)) {
        return -1e9;
      }
    }
    const len = curPath.length;
    const lenDiff = Math.abs(targetLen - len);
    let score = -lenDiff * 5.5 + mazeEdgesUsed * 8.0;

    if (motif === 'STRAIGHT') {
      if (turns === 0) score += 40.0 + len * 3.0;
      else score -= turns * 35.0;
    } else if (motif === 'L_BEND') {
      if (turns === 1) score += 38.0;
      else if (turns === 0) score += 10.0;
      else score -= (turns - 1) * 28.0;
    } else if (motif === 'U_BEND') {
      if (turns === 2 && oppSpinTurns === 0) score += 45.0;
      else if (oppSpinTurns > 0) score -= oppSpinTurns * 30.0;
    } else if (motif === 'PAPERCLIP') {
      // Reward 3..6 same-chirality turns (true paperclip coil!) and heavily penalize opposite turns
      score += sameSpinTurns * 18.0 - oppSpinTurns * 32.0;
      if (sameSpinTurns >= 3 && oppSpinTurns === 0) score += 45.0;
    } else {
      // SERPENT
      score += oppSpinTurns * 12.0;
    }
    return score;
  };

  const initScore = evaluateCutPath(path, 0, 0, 0, chosen.isMazeEdge ? 1 : 0);
  if (initScore > bestScore) {
    bestScore = initScore;
    bestPath = path.map(p => ({ ...p }));
  }

  if (targetLen <= 2 && initScore > -1e8 && !chosen.forcedNext) {
    remaining[chosen.hIdx] = 1;
    remaining[chosen.pIdx] = 1;
    return bestPath;
  }

  const maxNodes = targetLen >= 12 ? 180 : 80;
  let nodesVisited = 0;
  let foundIdeal = false;

  function dfs(
    cur,
    prevDir,
    firstTurnSpin,
    straightRun,
    turns,
    sameSpinTurns,
    oppSpinTurns,
    mazeEdgesUsed,
    forcedCell
  ) {
    if (foundIdeal || nodesVisited >= maxNodes) return;
    nodesVisited++;

    const curLen = path.length;
    const sc = evaluateCutPath(path, turns, sameSpinTurns, oppSpinTurns, mazeEdgesUsed);
    if (sc > bestScore) {
      bestScore = sc;
      bestPath = path.map(p => ({ ...p }));
      if (
        curLen >= targetLen &&
        ((motif === 'STRAIGHT' && turns === 0) ||
          (motif === 'L_BEND' && turns === 1) ||
          (motif === 'U_BEND' && turns === 2 && oppSpinTurns === 0) ||
          (motif === 'PAPERCLIP' && sameSpinTurns >= 3 && oppSpinTurns === 0) ||
          motif === 'SERPENT')
      ) {
        foundIdeal = true;
        return;
      }
    }

    const effectiveCap =
      shadowedByFixed && shadowedByFixed[cur.idx] === 1 ? targetLen + 8 : targetLen;
    if (curLen >= effectiveCap) return;

    const options = [];
    for (const { dr, dc } of DIRS) {
      const nr = cur.r + dr;
      const nc = cur.c + dc;
      if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
      const nIdx = nr * cols + nc;
      if (remaining[nIdx] !== 1) continue;
      if (forcedCell && forcedCell.idx !== nIdx) continue;

      const isTurn = dr !== prevDir.dr || dc !== prevDir.dc;
      if (isTurn && turns + 1 > maxMotifTurns && !(shadowedByFixed && shadowedByFixed[nIdx] === 1)) {
        continue;
      }

      remaining[nIdx] = 0;

      // Check if cur's other neighbors became degree-0 isolated cells
      let leftBehindIsolated = false;
      for (const dCheck of DIRS) {
        const cr = cur.r + dCheck.dr;
        const cc = cur.c + dCheck.dc;
        if (cr >= 0 && cr < rows && cc >= 0 && cc < cols) {
          const cIdx = cr * cols + cc;
          if (remaining[cIdx] === 1 && countNeighbors(cr, cc, rows, cols, remaining) === 0) {
            leftBehindIsolated = true;
            break;
          }
        }
      }
      if (leftBehindIsolated) {
        remaining[nIdx] = 1;
        continue;
      }

      let nextForced = null;
      let nextIsoCount = 0;
      for (const d2 of DIRS) {
        const nnr = nr + d2.dr;
        const nnc = nc + d2.dc;
        if (nnr >= 0 && nnr < rows && nnc >= 0 && nnc < cols) {
          const nnIdx = nnr * cols + nnc;
          if (remaining[nnIdx] === 1 && countNeighbors(nnr, nnc, rows, cols, remaining) === 0) {
            nextIsoCount++;
            nextForced = { r: nnr, c: nnc, idx: nnIdx };
          }
        }
      }
      const degAfter = countNeighbors(nr, nc, rows, cols, remaining);
      remaining[nIdx] = 1;

      if (nextIsoCount > 1) continue;

      const isMazeEdge = mazeAdj[cur.idx] && mazeAdj[cur.idx].has(nIdx);
      const isShadowed = shadowedByFixed && shadowedByFixed[nIdx] === 1;
      const cross = isTurn ? turnCross(prevDir, { dr, dc }) : 0;
      const desiredSpin = firstTurnSpin !== 0 ? firstTurnSpin : lockedSpin;

      let stepScore = rng() * 1.6;
      if (isShadowed) stepScore += 22.0;

      // Strongly prefer walking along the Classic Maze edges from Stage 1!
      if (isMazeEdge) stepScore += 14.0;
      if (degAfter === 1 || degAfter === 2) stepScore += 4.0;

      if (motif === 'STRAIGHT') {
        if (!isTurn) stepScore += 30.0;
        else stepScore -= 40.0;
      } else if (motif === 'L_BEND') {
        if (turns === 0) {
          // Walk straight for 3..8 cells, then make 1 clean 90° turn
          if (!isTurn && straightRun < Math.max(3, Math.floor(targetLen * 0.55))) {
            stepScore += 18.0;
          } else if (isTurn && straightRun >= 2) {
            stepScore += 22.0;
          }
        } else {
          // After the 1st turn, stay straight for the rest of the L!
          if (!isTurn) stepScore += 28.0;
          else stepScore -= 35.0;
        }
      } else if (motif === 'U_BEND') {
        if (!isTurn) {
          // Long first leg (3..8), short middle base (1..3), long parallel return leg (3..8)
          const idealLeg = turns === 1 ? 2 : Math.max(3, Math.floor(targetLen * 0.4));
          if (straightRun < idealLeg) stepScore += 16.0;
          else stepScore -= 6.0;
        } else {
          if (cross === desiredSpin && straightRun >= (turns === 1 ? 1 : 2)) {
            stepScore += 26.0;
          } else {
            stepScore -= 30.0; // Never turn the wrong way in a U-bend!
          }
        }
      } else if (motif === 'PAPERCLIP') {
        if (!isTurn) {
          // Paperclip spiral legs: outer legs 3..6 cells, inner legs 2..4 cells
          const idealLeg = Math.max(2, 5 - Math.floor(turns / 2));
          if (straightRun < idealLeg) stepScore += 15.0;
          else stepScore -= 8.0;
        } else {
          // MUST turn in the SAME chirality `desiredSpin` to form a Paperclip Spiral (回形针弯)!
          if (cross === desiredSpin && straightRun >= 2) {
            stepScore += 28.0;
          } else if (cross === desiredSpin && straightRun === 1 && turns >= 1) {
            stepScore += 12.0; // Allow tight inner paperclip core!
          } else {
            stepScore -= 35.0; // Block S-turns inside a Paperclip!
          }
        }
      } else {
        // SERPENT: alternating turns
        if (!isTurn && straightRun < 3) stepScore += 10.0;
        else if (isTurn && cross === -desiredSpin && straightRun >= 2) stepScore += 18.0;
      }

      options.push({
        r: nr,
        c: nc,
        idx: nIdx,
        dr,
        dc,
        isTurn,
        cross,
        isMazeEdge,
        nextForced,
        stepScore,
      });
    }

    options.sort((a, b) => b.stepScore - a.stepScore);

    for (const opt of options) {
      remaining[opt.idx] = 0;
      path.push({ r: opt.r, c: opt.c, idx: opt.idx });

      const nextSpin = opt.isTurn
        ? firstTurnSpin === 0
          ? opt.cross
          : firstTurnSpin
        : firstTurnSpin;
      const isSameSpin = opt.isTurn && (firstTurnSpin === 0 || opt.cross === firstTurnSpin);
      const isOppSpin = opt.isTurn && firstTurnSpin !== 0 && opt.cross !== firstTurnSpin;

      dfs(
        { r: opt.r, c: opt.c, idx: opt.idx },
        { dr: opt.dr, dc: opt.dc },
        motif === 'SERPENT' && opt.isTurn ? opt.cross : nextSpin,
        opt.isTurn ? 1 : straightRun + 1,
        turns + (opt.isTurn ? 1 : 0),
        sameSpinTurns + (isSameSpin ? 1 : 0),
        oppSpinTurns + (isOppSpin ? 1 : 0),
        mazeEdgesUsed + (opt.isMazeEdge ? 1 : 0),
        opt.nextForced
      );

      path.pop();
      remaining[opt.idx] = 1;
      if (foundIdeal || nodesVisited >= maxNodes) break;
    }
  }

  dfs(
    { r: chosen.pr, c: chosen.pc, idx: chosen.pIdx },
    { dr: -chosen.dr, dc: -chosen.dc },
    0,
    1,
    0,
    0,
    0,
    chosen.isMazeEdge ? 1 : 0,
    chosen.forcedNext || null
  );

  remaining[chosen.hIdx] = 1;
  remaining[chosen.pIdx] = 1;

  return bestPath;
}

/**
 * Main Two-Stage Generator:
 * 1. Builds a Classic Maze on `targetGrid` (`buildClassicMazeGraph`)
 * 2. Cuts openings and attaches arrowheads along the maze corridors (`sliceMazeCorridor`)
 */
function partitionCellsIntoArrows({
  rows,
  cols,
  targetGrid,
  fixedObstacleGrid = null,
  minLen = 2,
  maxLen = 28,
  seed = 1001,
  startId = 1,
}) {
  const rng = createRNG(seed);
  const remaining = new Uint8Array(targetGrid);
  const obstacles = new Uint8Array(rows * cols);
  const shadowedByFixed = new Uint8Array(rows * cols);

  for (let i = 0; i < rows * cols; i++) {
    if (remaining[i] === 1 || (fixedObstacleGrid && fixedObstacleGrid[i] === 1)) {
      obstacles[i] = 1;
    }
  }

  if (fixedObstacleGrid) {
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const idx = r * cols + c;
        if (remaining[idx] === 1) {
          let hasClearDir = false;
          for (const { dr, dc } of DIRS) {
            if (checkRayOnGrid(r, c, dr, dc, rows, cols, fixedObstacleGrid, null).clear) {
              hasClearDir = true;
              break;
            }
          }
          if (!hasClearDir) shadowedByFixed[idx] = 1;
        }
      }
    }
  }

  const peeledGrid = new Uint8Array(rows * cols);
  const peeledStepGrid = new Uint16Array(rows * cols);
  const peeledDirGrid = new Uint8Array(rows * cols);

  // Interlocking & Multi-Line Dispersion trackers
  const globalDirCount = [0, 0, 0, 0];
  const rowHorizDirCount = Array.from({ length: rows }, () => [0, 0, 0, 0]);
  const colVertDirCount = Array.from({ length: cols }, () => [0, 0, 0, 0]);
  const placedHeads = []; // { r, c, dirIdx }
  const dependentsCount = new Uint16Array(512); // How many arrows are directly unlocked by step `s`
  let unblockedFrontierCount = 0;
  let prevChosenDirIdx = -1;

  const orphanCells = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const idx = r * cols + c;
      if (remaining[idx] === 1 && countNeighbors(r, c, rows, cols, remaining) === 0) {
        orphanCells.push({ r, c, idx });
        remaining[idx] = 0;
        obstacles[idx] = 0;
      }
    }
  }

  // STAGE 1: Generate the Classic Maze corridor graph on `remaining`!
  const mazeAdj = buildClassicMazeGraph(rows, cols, remaining, rng);

  let totalRemaining = 0;
  for (let i = 0; i < rows * cols; i++) {
    if (remaining[i] === 1) totalRemaining++;
  }

  const arrows = [];
  let nextId = startId;
  let stepIndex = 0;

  // STAGE 2: Cut openings along the Classic Maze corridors and attach arrowheads
  while (totalRemaining > 0) {
    const candidates = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const hIdx = r * cols + c;
        if (remaining[hIdx] !== 1) continue;

        for (const { dr, dc } of DIRS) {
          const pr = r - dr;
          const pc = c - dc;
          if (pr < 0 || pr >= rows || pc < 0 || pc >= cols) continue;
          const pIdx = pr * cols + pc;
          if (remaining[pIdx] !== 1) continue;

          const rayCheck = checkRayOnGrid(
            r,
            c,
            dr,
            dc,
            rows,
            cols,
            obstacles,
            peeledGrid,
            peeledStepGrid,
            peeledDirGrid
          );
          if (rayCheck.clear) {
            const isMazeEdge = mazeAdj[hIdx] && mazeAdj[hIdx].has(pIdx);
            candidates.push({
              hr: r,
              hc: c,
              hIdx,
              pr,
              pc,
              pIdx,
              dr,
              dc,
              dirIdx: dirToIdx(dr, dc),
              isMazeEdge,
              passedPeeled: rayCheck.passedPeeled,
              latestBlockerStep: rayCheck.latestBlockerStep,
              latestBlockerDir: rayCheck.latestBlockerDir,
              orthoBlockers: rayCheck.orthoBlockers,
              sameDirBlockers: rayCheck.sameDirBlockers,
              oppDirBlockers: rayCheck.oppDirBlockers,
              distinctBlockers: rayCheck.distinctBlockers,
            });
          }
        }
      }
    }

    if (candidates.length === 0) {
      let absorbedIntoExisting = false;
      for (let i = arrows.length - 1; i >= 0; i--) {
        const existingArrow = arrows[i];
        const existDirIdx = dirToIdx(existingArrow.dir.dr, existingArrow.dir.dc);
        let grew = true;
        while (grew) {
          grew = false;
          const tail = existingArrow.cells[0];
          for (const { dr, dc } of DIRS) {
            const nr = tail.r + dr;
            const nc = tail.c + dc;
            if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
            const nIdx = nr * cols + nc;
            if (remaining[nIdx] !== 1) continue;

            let blocksEarlierRay = false;
            for (let j = 0; j <= i; j++) {
              const a = arrows[j];
              const adr = a.dir.dr;
              const adc = a.dir.dc;
              if (
                (adr !== 0 && nc === a.head.c && (nr - a.head.r) * adr > 0) ||
                (adc !== 0 && nr === a.head.r && (nc - a.head.c) * adc > 0)
              ) {
                blocksEarlierRay = true;
                break;
              }
            }
            if (!blocksEarlierRay) {
              existingArrow.cells.unshift({ r: nr, c: nc });
              remaining[nIdx] = 0;
              obstacles[nIdx] = 0;
              peeledGrid[nIdx] = 1;
              peeledStepGrid[nIdx] = i + 1;
              peeledDirGrid[nIdx] = existDirIdx;
              totalRemaining--;
              grew = true;
              absorbedIntoExisting = true;
              break;
            }
          }
        }
      }

      if (absorbedIntoExisting) {
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const idx = r * cols + c;
            if (remaining[idx] === 1 && countNeighbors(r, c, rows, cols, remaining) === 0) {
              orphanCells.push({ r, c, idx });
              remaining[idx] = 0;
              obstacles[idx] = 0;
              totalRemaining--;
            }
          }
        }
        if (totalRemaining <= 0) break;
        continue;
      }

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const hIdx = r * cols + c;
          if (remaining[hIdx] !== 1) continue;
          for (const { dr, dc } of DIRS) {
            const pr = r - dr;
            const pc = c - dc;
            if (pr < 0 || pr >= rows || pc < 0 || pc >= cols) continue;
            const pIdx = pr * cols + pc;
            if (remaining[pIdx] !== 1) continue;
            const rayCheck = checkRayOnGrid(
              r,
              c,
              dr,
              dc,
              rows,
              cols,
              remaining,
              peeledGrid,
              peeledStepGrid,
              peeledDirGrid
            );
            if (rayCheck.clear) {
              candidates.push({
                hr: r,
                hc: c,
                hIdx,
                pr,
                pc,
                pIdx,
                dr,
                dc,
                dirIdx: dirToIdx(dr, dc),
                isMazeEdge: mazeAdj[hIdx] && mazeAdj[hIdx].has(pIdx),
                passedPeeled: rayCheck.passedPeeled,
                latestBlockerStep: rayCheck.latestBlockerStep,
                latestBlockerDir: rayCheck.latestBlockerDir,
                orthoBlockers: rayCheck.orthoBlockers,
                sameDirBlockers: rayCheck.sameDirBlockers,
                oppDirBlockers: rayCheck.oppDirBlockers,
                distinctBlockers: rayCheck.distinctBlockers,
              });
            }
          }
        }
      }
      if (candidates.length === 0) break;
    }

    const motif = sampleCutMotif(rng, stepIndex);
    const targetLen =
      motif === 'STRAIGHT'
        ? rng() < 0.55
          ? 2 + Math.floor(rng() * 3) // 2..4 short straight pin
          : 6 + Math.floor(rng() * 9) // 6..14 long straight spear
        : sampleMazeCutLength(rng, stepIndex, minLen, maxLen);
    stepIndex++;

    const avgGlobalDir = arrows.length / 4;

    const scoreCandidate = cand => {
      const dIdx = cand.dirIdx;
      const degH = countNeighbors(cand.hr, cand.hc, rows, cols, remaining);

      let w = 10.0 + (cand.isMazeEdge ? 14.0 : 0) + (degH === 1 ? 3.5 : 0) + rng() * 2.2;

      // 1. TIGHT INITIAL FRONTIER (4 QUADRANT SEEDS) & DEEP DEPENDENCY CHAIN:
      // Allow 4 initial unblocked entry arrows (1 in each direction & spread across the 4 quadrants),
      // then force all remaining ~95% of arrows to be deeply interlocked (`passedPeeled > 0`)!
      if (cand.passedPeeled === 0) {
        if (unblockedFrontierCount >= 4) {
          w -= 85.0;
        } else {
          // Force the 4 initial unblocked arrows to have 4 distinct directions and be far apart!
          if (globalDirCount[dIdx] > 0) {
            w -= 60.0;
          } else {
            w += 30.0;
          }
          if (placedHeads.length > 0) {
            let minDist = 999;
            for (const ph of placedHeads) {
              const d = Math.abs(ph.r - cand.hr) + Math.abs(ph.c - cand.hc);

  drawSingleArrow(ctx, arrow, cs, now) {
    const slitherState = this.slitheringArrows.get(arrow.id);
    const shakeState = this.shakingArrows.get(arrow.id);
    const isHinted = this.hintArrowId === arrow.id;

    let progressSteps = slitherState ? slitherState.progressSteps : 0;

    let shakeOffsetX = 0;
    let shakeOffsetY = 0;
    if (shakeState) {
      const elapsed = (now - shakeState.startTime) / 1000;
      const progress = Math.min(1, (now - shakeState.startTime) / shakeState.duration);
      const damping = Math.pow(1 - progress, 1.8);

      const lungeBounce = Math.sin(progress * Math.PI) * Math.min(0.28, shakeState.freeSteps * 0.18);
      progressSteps += lungeBounce;

      const wave = Math.sin(elapsed * 58) * damping * cs * 0.18;
      const crossWave = Math.cos(elapsed * 44) * damping * cs * 0.11;
      shakeOffsetX = shakeState.dir.dc * wave + shakeState.dir.dr * crossWave;
      shakeOffsetY = shakeState.dir.dr * wave + shakeState.dir.dc * crossWave;
    }

    let scaleAlpha = 1.0;
    if (this.shuffleTransition) {
      const t = Math.min(
        1,
        (now - this.shuffleTransition.startTime) / this.shuffleTransition.duration
      );
      scaleAlpha = 0.35 + 0.65 * Math.sin((t * Math.PI) / 2);
    }

    const { points, dir } = this.getSlitheredGridPoints(arrow, progressSteps);
    if (points.length < 2) return;

    const worldPts = new Array(points.length);
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      worldPts[i] = {
        x: this.boardOriginX + (p.c + 0.5) * cs + shakeOffsetX,
        y: this.boardOriginY + (p.r + 0.5) * cs + shakeOffsetY,
      };
    }

    const lastIdx = worldPts.length - 1;
    const headPtX = worldPts[lastIdx].x;
    const headPtY = worldPts[lastIdx].y;
    const lineEndOffset = cs * 0.06;
    worldPts[lastIdx] = {
      x: headPtX - dir.dc * lineEndOffset,
      y: headPtY - dir.dr * lineEndOffset,
    };

    ctx.save();
    if (scaleAlpha < 0.999) {
      ctx.globalAlpha = scaleAlpha;
    }

    const strokeWidth = Math.max(1.5, cs * 0.23);
    const cornerRadius = cs * 0.14;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Hardware-accelerated vector halo for Hint (no slow Gaussian shadowBlur!)
    if (isHinted) {
      const pulse = 0.5 + 0.5 * Math.sin(now * 0.009);
      ctx.strokeStyle = `rgba(255, 255, 255, ${0.32 + pulse * 0.28})`;
      ctx.lineWidth = strokeWidth * (1.85 + pulse * 0.45);
      this.traceRoundedPolyline(ctx, worldPts, cornerRadius);
      ctx.stroke();
    }

    let activePaint = arrow.color;
    if (arrow.isBonusRed) {
      activePaint = '#ff2e4c';
      const redPulse = 0.5 + 0.5 * Math.sin(now * 0.022);
      ctx.strokeStyle = `rgba(255, 46, 76, ${0.34 + redPulse * 0.32})`;
      ctx.lineWidth = strokeWidth * (1.9 + redPulse * 0.45);
      this.traceRoundedPolyline(ctx, worldPts, cornerRadius);
      ctx.stroke();
    } else if (arrow.isRainbow) {
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;
      for (let i = 0; i < worldPts.length; i++) {
        const p = worldPts[i];
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      }
      const span = Math.max(cs * 2.5, Math.hypot(maxX - minX, maxY - minY));
      const angle = (now * 0.0018) % (Math.PI * 2);
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      const gx0 = cx - Math.cos(angle) * span * 0.65;
      const gy0 = cy - Math.sin(angle) * span * 0.65;
      const gx1 = cx + Math.cos(angle) * span * 0.65;
      const gy1 = cy + Math.sin(angle) * span * 0.65;

      const grad = ctx.createLinearGradient(gx0, gy0, gx1, gy1);
      const hueShift = (now * 0.14) % 360;
      const stops = [0, 0.17, 0.33, 0.5, 0.67, 0.83, 1.0];
      for (let s = 0; s < stops.length; s++) {
        const h = (hueShift + s * 52) % 360;
        grad.addColorStop(stops[s], `hsl(${h}, 95%, 64%)`);
      }
      activePaint = grad;

      // Vector rainbow outer glow (zero shadowBlur!)
      ctx.save();
      ctx.globalAlpha = scaleAlpha * 0.32;
      ctx.strokeStyle = grad;
      ctx.lineWidth = strokeWidth * 1.75;
      this.traceRoundedPolyline(ctx, worldPts, cornerRadius);
      ctx.stroke();
      ctx.restore();
    }

    // Main arrow body stroke
    ctx.strokeStyle = activePaint;
    ctx.lineWidth = strokeWidth;
    this.traceRoundedPolyline(ctx, worldPts, cornerRadius);
    ctx.stroke();

    // Draw crisp triangular arrowhead at (headPtX, headPtY) pointing in `dir`
    const tipLength = cs * 0.32;
    const backLength = cs * 0.16;
    const halfWing = cs * 0.24;

    const tipX = headPtX + dir.dc * tipLength;
    const tipY = headPtY + dir.dr * tipLength;
    const baseCenterX = headPtX - dir.dc * backLength;
    const baseCenterY = headPtY - dir.dr * backLength;

    const perpX = -dir.dr;
    const perpY = dir.dc;

    const leftX = baseCenterX + perpX * halfWing;
    const leftY = baseCenterY + perpY * halfWing;
    const rightX = baseCenterX - perpX * halfWing;
    const rightY = baseCenterY - perpY * halfWing;

    ctx.fillStyle = activePaint;
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(leftX, leftY);
    ctx.lineTo(rightX, rightY);
    ctx.closePath();
    ctx.fill();
    ctx.lineWidth = Math.max(1.2, cs * 0.06);
    ctx.strokeStyle = activePaint;
    ctx.stroke();

    // If hinted, draw a subtle white inner highlight core
    if (isHinted) {
      const pulse = 0.5 + 0.5 * Math.sin(now * 0.009);
      ctx.strokeStyle = `rgba(255, 255, 255, ${0.45 + pulse * 0.45})`;
      ctx.lineWidth = strokeWidth * 0.42;
      this.traceRoundedPolyline(ctx, worldPts, cornerRadius);
      ctx.stroke();
    }

    ctx.restore();
  }

  traceRoundedPolyline(ctx, pts, radius) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length - 1; i++) {
      const prev = pts[i - 1];
      const cur = pts[i];
      const next = pts[i + 1];
      const d1 = Math.hypot(cur.x - prev.x, cur.y - prev.y);
      const d2 = Math.hypot(next.x - cur.x, next.y - cur.y);
      const r = Math.min(radius, d1 * 0.45, d2 * 0.45);
      if (r > 0.5) {
        ctx.arcTo(cur.x, cur.y, next.x, next.y, r);
      } else {
        ctx.lineTo(cur.x, cur.y);
      }
    }
    const last = pts[pts.length - 1];
    ctx.lineTo(last.x, last.y);
  }
}

/**
 * Main Application Controller for 《一箭又一箭》 纯净定制版
 */





const STORAGE_KEY = 'arrow_by_arrow_alphabet26_classic_maze_v6';
const LEGACY_STORAGE_KEYS = [
  'arrow_by_arrow_custom_save_v1',
  'arrow_by_arrow_custom_save_v2',
  'arrow_by_arrow_custom_save_v3',
  'arrow_by_arrow_custom_save_v4',
  'arrow_by_arrow_custom_save_v5',
];

function cloneArrows(arrows) {
  return arrows.map(a => ({
    ...a,
    cells: a.cells.map(c => ({ r: c.r, c: c.c })),
    head: { r: a.head.r, c: a.head.c },
    dir: { dr: a.dir.dr, dc: a.dir.dc },
    removed: Boolean(a.removed),
    isRainbow: Boolean(a.isRainbow),
    isBonusRed: false,
  }));
}
function formatTime(seconds) {
  const s = Math.max(0, Math.floor(seconds));
  const m = Math.floor(s / 60);
  const rem = s % 60;
  return `${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
}

/**
 * Generate SVG markup for a 3D faceted Gold or Grey Star (Mahjong Titan Screenshot 3 & 4 style)
 */
function createStarSVG(isGold = false, extraClass = '') {
  const uid = Math.random().toString(36).slice(2, 8);
  const cTop = isGold ? '#fff380' : '#9ca3af';
  const cMid = isGold ? '#f7b500' : '#6b7280';
  const cBot = isGold ? '#c97a00' : '#4b5563';
  const stroke = isGold ? '#b46900' : '#374151';

  return `
    <svg viewBox="0 0 100 100" class="${extraClass}">
      <defs>
        <linearGradient id="sg_${uid}" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="${cTop}" />
          <stop offset="55%" stop-color="${cMid}" />
          <stop offset="100%" stop-color="${cBot}" />
        </linearGradient>
      </defs>
      <polygon
        points="50,5 63,35 95,38 70,59 78,91 50,73 22,91 30,59 5,38 37,35"
        fill="url(#sg_${uid})"
        stroke="${stroke}"
        stroke-width="3"
        stroke-linejoin="round"
      />
      <polygon
        points="50,5 63,35 50,52 37,35"
        fill="rgba(255,255,255,0.28)"
      />
      <polygon
        points="50,52 95,38 70,59"

      />
      <polygon
        points="50,52 22,91 30,59"
